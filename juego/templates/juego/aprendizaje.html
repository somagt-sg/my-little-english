{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Little English - Learning Time
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                "Trebuchet MS",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #bdefff 0%,
                    #e9faff 55%,
                    #ffe9b8 100%
                );

            overflow-x: hidden;

        }


        /* =====================================================
           CONTENEDOR PRINCIPAL
        ===================================================== */

        .page {

            min-height: 100vh;

            width: 100%;

            display: flex;

            flex-direction: column;

        }


        /* =====================================================
           BARRA SUPERIOR
        ===================================================== */

        .top-bar {

            width: 100%;

            min-height: 82px;

            padding:
                10px 22px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            box-shadow:
                0 5px 18px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );

            position: relative;

            z-index: 10;

        }


        .top-title {

            display: flex;

            align-items: center;

            gap: 10px;

            color: #155e75;

            font-size:
                clamp(
                    22px,
                    4vw,
                    34px
                );

            font-weight: 900;

        }


        .top-center {

            text-align: center;

        }


        .top-mission {

            color: #526b76;

            font-size:
                clamp(
                    13px,
                    2vw,
                    17px
                );

            font-weight: 800;

        }


        .score-box {

            min-width: 105px;

            padding:
                10px 16px;

            border-radius: 18px;

            background:
                #fff4c7;

            color: #8a5a00;

            font-size: 20px;

            font-weight: 900;

            text-align: center;

        }


        /* =====================================================
           CONTENIDO
        ===================================================== */

        .content {

            width: 100%;

            flex: 1;

            padding:
                25px 20px 35px;

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        /* =====================================================
           CATEGORIAS
        ===================================================== */

        #categoryScreen {

            width: 100%;

            max-width: 1200px;

            display: block;

        }


        .category-title {

            text-align: center;

            color: #155e75;

            font-size:
                clamp(
                    30px,
                    6vw,
                    48px
                );

            font-weight: 900;

            margin-top: 5px;

            margin-bottom: 10px;

        }


        .category-subtitle {

            text-align: center;

            color: #526b76;

            font-size:
                clamp(
                    16px,
                    3vw,
                    21px
                );

            font-weight: 700;

            margin-bottom: 28px;

        }


        .category-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 25px;

            width: 100%;

        }


        .category-card {

            border: 5px solid transparent;

            border-radius: 30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            padding: 25px 18px;

            cursor: pointer;

            font-family: inherit;

            min-height: 300px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;

            box-shadow:
                0 12px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );

        }


        .category-card:hover {

            transform:
                translateY(-7px);

            border-color:
                #38bdf8;

            box-shadow:
                0 18px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.15
                );

        }


        .category-icon {

            font-size: 80px;

            margin-bottom: 12px;

        }


        .category-name {

            color: #243b53;

            font-size: 27px;

            font-weight: 900;

            text-align: center;

        }


        .category-count {

            color: #64748b;

            font-size: 17px;

            font-weight: 700;

            margin-top: 8px;

            text-align: center;

        }


        /* =====================================================
           COLOR ESPECIAL DE CATEGORIAS
        ===================================================== */

        .category-card.fruits-card {
            border-top-color: #ef4444;
        }

        .category-card.colors-card {
            border-top-color: #a855f7;
        }

        .category-card.objects-card {
            border-top-color: #38bdf8;
        }

        .category-card.numbers-card {
            border-top-color: #22c55e;
        }

        .category-card.animals-card {
            border-top-color: #f59e0b;
        }

        .category-card.body-card {
            border-top-color: #ec4899;
        }

        .category-card.clothes-card {
            border-top-color: #8b5cf6;
        }

        .category-card.food-card {
            border-top-color: #f97316;
        }

        .category-card.games-card {
            border-top-color: #06b6d4;
        }


        /* =====================================================
           PANTALLA DE APRENDIZAJE
        ===================================================== */

        #learningScreen {

            display: none;

            width: 100%;

            max-width: 1200px;

        }


        .learning-header {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 15px;

        }


        .back-button {

            border: none;

            border-radius: 16px;

            background:
                #ffffff;

            color:
                #155e75;

            font-family: inherit;

            font-size: 17px;

            font-weight: 900;

            padding:
                11px 18px;

            cursor: pointer;

            box-shadow:
                0 5px 12px
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );

        }


        .back-button:hover {

            transform:
                translateY(-2px);

        }


        .current-category {

            text-align: center;

            color: #155e75;

            font-size:
                clamp(
                    25px,
                    5vw,
                    38px
                );

            font-weight: 900;

            flex: 1;

        }


        .word-progress {

            min-width: 100px;

            padding:
                10px 15px;

            border-radius: 15px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.9
                );

            color:
                #526b76;

            font-size: 16px;

            font-weight: 900;

            text-align: center;

        }


        /* =====================================================
           TARJETA PRINCIPAL
        ===================================================== */

        .learning-card {

            width: 100%;

            min-height:
                min(
                    650px,
                    72vh
                );

            border-radius: 35px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            box-shadow:
                0 20px 45px
                rgba(
                    55,
                    90,
                    110,
                    0.18
                );

            padding:
                30px;

            position: relative;

            overflow: hidden;

        }


        /* =====================================================
           ESCENARIO
        ===================================================== */

        .learning-scene {

            width: 100%;

            min-height:
                510px;

            border-radius: 28px;

            background:
                linear-gradient(
                    180deg,
                    #e7faff 0%,
                    #ffffff 62%,
                    #fff0c7 62%,
                    #ffd889 100%
                );

            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* =====================================================
           NUBES
        ===================================================== */

        .scene-cloud {

            position: absolute;

            width: 130px;

            height: 38px;

            border-radius: 50px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.90
                );

        }


        .scene-cloud::before,
        .scene-cloud::after {

            content: "";

            position: absolute;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.90
                );

            border-radius: 50%;

        }


        .scene-cloud::before {

            width: 55px;

            height: 55px;

            left: 20px;

            top: -28px;

        }


        .scene-cloud::after {

            width: 65px;

            height: 65px;

            right: 18px;

            top: -35px;

        }


        .cloud-a {

            top: 55px;

            left: 8%;

        }


        .cloud-b {

            top: 100px;

            right: 8%;

            transform:
                scale(0.8);

        }


        /* =====================================================
           ELEMENTO GRANDE
        ===================================================== */

        .word-area {

            width: 60%;

            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            position: relative;

            z-index: 3;

            padding-bottom: 20px;

        }


        .learning-emoji {

            width:
                clamp(
                    220px,
                    28vw,
                    330px
                );

            height:
                clamp(
                    220px,
                    28vw,
                    330px
                );

            border-radius: 45px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.90
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size:
                clamp(
                    130px,
                    18vw,
                    210px
                );

            box-shadow:
                0 15px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );

            border:
                5px solid
                rgba(
                    255,
                    255,
                    255,
                    0.85
                );

            animation:
                itemAppear
                0.4s ease;

        }


        @keyframes itemAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.75)
                    translateY(20px);

            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

            }

        }


        .word-name {

            margin-top: 18px;

            color:
                #155e75;

            font-size:
                clamp(
                    35px,
                    6vw,
                    60px
                );

            font-weight: 900;

            letter-spacing:
                1px;

            text-transform:
                uppercase;

            text-shadow:
                2px 3px 0
                #d7f5ff;

            text-align: center;

        }


        /* =====================================================
           BOTON DE VOZ
        ===================================================== */

        .speak-button {

            margin-top: 15px;

            min-width: 150px;

            height: 55px;

            border: none;

            border-radius: 18px;

            background:
                #38bdf8;

            color: white;

            font-family: inherit;

            font-size: 20px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 6px 0
                #1684b8;

            transition:
                transform 0.15s ease;

        }


        .speak-button:hover {

            background:
                #25aeea;

        }


        .speak-button:active {

            transform:
                translateY(5px);

            box-shadow:
                0 1px 0
                #1684b8;

        }


        /* =====================================================
           PERSONAJE
        ===================================================== */

        .character-area {

            position: absolute;

            right:
                5%;

            bottom: 0;

            width:
                clamp(
                    210px,
                    24vw,
                    310px
                );

            height:
                92%;

            display: flex;

            align-items: flex-end;

            justify-content: center;

            z-index: 4;

        }


        #character {

            display: block;

            width:
                clamp(
                    180px,
                    21vw,
                    280px
                );

            height: auto;

            max-height:
                95%;

            object-fit:
                contain;

            object-position:
                bottom center;

            filter:
                drop-shadow(
                    0 9px 7px
                    rgba(
                        0,
                        0,
                        0,
                        0.18
                    )
                );

            transition:
                transform 0.25s ease;

            animation:
                characterAppear
                0.5s ease;

        }


        @keyframes characterAppear {

            from {

                opacity: 0;

                transform:
                    translateX(80px);

            }

            to {

                opacity: 1;

                transform:
                    translateX(0);

            }

        }


        /* =====================================================
           NAVEGACION
        ===================================================== */

        .navigation {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 20px;

            margin-top: 20px;

        }


        .nav-button {

            width: 75px;

            height: 62px;

            border: none;

            border-radius: 20px;

            background:
                #f59e0b;

            color: white;

            font-family: inherit;

            font-size: 34px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 6px 0
                #bd7000;

            transition:
                transform 0.15s ease;

        }


        .nav-button:hover {

            background:
                #ffad19;

        }


        .nav-button:active {

            transform:
                translateY(5px);

            box-shadow:
                0 1px 0
                #bd7000;

        }


        .nav-button:disabled {

            opacity: 0.35;

            cursor:
                not-allowed;

        }


        .page-indicator {

            min-width: 130px;

            padding:
                12px 18px;

            border-radius: 17px;

            background:
                #fff4c7;

            color:
                #8a5a00;

            font-size: 18px;

            font-weight: 900;

            text-align: center;

        }


        /* =====================================================
           COMPLETADO
        ===================================================== */

        #completeScreen {

            display: none;

            width: 100%;

            max-width: 900px;

            text-align: center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            border-radius: 35px;

            padding:
                45px 25px;

            box-shadow:
                0 20px 45px
                rgba(
                    55,
                    90,
                    110,
                    0.18
                );

        }


        .complete-icon {

            font-size:
                clamp(
                    80px,
                    15vw,
                    130px
                );

            margin-bottom: 10px;

        }


        .complete-title {

            color:
                #155e75;

            font-size:
                clamp(
                    34px,
                    7vw,
                    55px
                );

            font-weight: 900;

        }


        .complete-text {

            color:
                #526b76;

            font-size: 21px;

            font-weight: 700;

            margin-top: 12px;

            line-height: 1.5;

        }


        .complete-buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-top: 30px;

        }


        .complete-button {

            border: none;

            border-radius: 18px;

            padding:
                15px 25px;

            min-width: 180px;

            font-family: inherit;

            font-size: 19px;

            font-weight: 900;

            cursor: pointer;

            color: white;

        }


        .next-category-button {

            background:
                #22c55e;

            box-shadow:
                0 5px 0
                #15803d;

        }


        .categories-button {

            background:
                #38bdf8;

            box-shadow:
                0 5px 0
                #1684b8;

        }


        .menu-button {

            background:
                #f59e0b;

            box-shadow:
                0 5px 0
                #bd7000;

        }


        /* =====================================================
           MENSAJE DE AVANCE
        ===================================================== */

        .small-message {

            min-height: 25px;

            text-align: center;

            margin-top: 10px;

            color:
                #526b76;

            font-size: 15px;

            font-weight: 800;

        }


        /* =====================================================
           MINI JUEGOS
        ===================================================== */

        #gameScreen {

            display: none;

            width: 100%;

            max-width: 1200px;

        }


        .game-header {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 15px;

        }


        .game-title {

            flex: 1;

            text-align: center;

            color: #155e75;

            font-size:
                clamp(
                    27px,
                    5vw,
                    42px
                );

            font-weight: 900;

        }


        .game-card {

            width: 100%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            border-radius: 35px;

            padding: 30px;

            box-shadow:
                0 20px 45px
                rgba(
                    55,
                    90,
                    110,
                    0.18
                );

            text-align: center;

        }


        .game-question {

            color: #155e75;

            font-size:
                clamp(
                    26px,
                    5vw,
                    42px
                );

            font-weight: 900;

            margin-bottom: 20px;

        }


        .game-instruction {

            color: #526b76;

            font-size: 19px;

            font-weight: 800;

            margin-bottom: 25px;

        }


        .game-options {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 20px;

            max-width: 850px;

            margin:
                0 auto;

        }


        .game-option {

            min-height: 170px;

            border: 5px solid #e2e8f0;

            border-radius: 28px;

            background: #ffffff;

            font-family: inherit;

            cursor: pointer;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 8px;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;

            box-shadow:
                0 8px 18px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        .game-option:hover {

            transform:
                translateY(-5px);

            border-color:
                #38bdf8;

            background:
                #f0fbff;

        }


        .game-option-emoji {

            font-size: 65px;

        }


        .game-option-text {

            font-size: 22px;

            font-weight: 900;

            color: #243b53;

        }


        .game-result {

            min-height: 40px;

            margin-top: 22px;

            font-size: 22px;

            font-weight: 900;

        }


        .game-correct {

            color: #15803d;

        }


        .game-wrong {

            color: #dc2626;

        }


        .game-next {

            display: none;

            margin-top: 20px;

            border: none;

            border-radius: 18px;

            padding:
                14px 25px;

            background:
                #22c55e;

            color: white;

            font-family: inherit;

            font-size: 19px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 5px 0
                #15803d;

        }


        .game-menu {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap: 18px;

            max-width: 800px;

            margin:
                0 auto;

        }


        .game-choice {

            min-height: 130px;

            border: none;

            border-radius: 25px;

            background: white;

            font-family: inherit;

            font-size: 22px;

            font-weight: 900;

            color: #243b53;

            cursor: pointer;

            box-shadow:
                0 10px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );

            border:
                5px solid
                #dbeafe;

            transition:
                transform 0.2s ease;

        }


        .game-choice:hover {

            transform:
                translateY(-5px);

            border-color:
                #38bdf8;

        }


        .game-choice span {

            display: block;

            font-size: 50px;

            margin-bottom: 8px;

        }


        /* =====================================================
           RESPONSIVE TABLET
        ===================================================== */

        @media (
            max-width: 900px
        ) {

            .category-grid {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

            }


            .category-card {

                min-height:
                    250px;

            }


            .learning-scene {

                min-height:
                    500px;

            }


            .word-area {

                width: 62%;

            }


            .character-area {

                right:
                    2%;

                width:
                    38%;

            }


            .game-options {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

            }

        }


        /* =====================================================
           RESPONSIVE CELULAR
        ===================================================== */

        @media (
            max-width: 650px
        ) {

            .top-bar {

                min-height:
                    70px;

                padding:
                    8px 10px;

            }


            .top-title {

                font-size:
                    20px;

            }


            .top-mission {

                display:
                    none;

            }


            .score-box {

                min-width:
                    80px;

                padding:
                    8px 10px;

                font-size:
                    16px;

            }


            .content {

                padding:
                    15px 10px 25px;

            }


            .category-grid {

                grid-template-columns:
                    1fr;

                gap: 18px;

            }


            .category-card {

                min-height:
                    190px;

                padding:
                    20px;

            }


            .category-icon {

                font-size:
                    65px;

            }


            .category-name {

                font-size:
                    24px;

            }


            .category-count {

                font-size:
                    15px;

            }


            .learning-header {

                flex-wrap:
                    wrap;

                justify-content:
                    center;

            }


            .current-category {

                order:
                    -1;

                width:
                    100%;

                flex:
                    none;

            }


            .back-button,
            .word-progress {

                flex:
                    1;

            }


            .learning-card {

                padding:
                    12px;

                border-radius:
                    25px;

            }


            .learning-scene {

                min-height:
                    560px;

                align-items:
                    flex-start;

            }


            .word-area {

                width:
                    100%;

                height:
                    58%;

                padding-top:
                    30px;

                position:
                    absolute;

                top:
                    0;

                left:
                    0;

            }


            .learning-emoji {

                width:
                    190px;

                height:
                    190px;

                font-size:
                    115px;

                border-radius:
                    30px;

            }


            .word-name {

                font-size:
                    38px;

                margin-top:
                    12px;

            }


            .speak-button {

                height:
                    48px;

                margin-top:
                    10px;

                font-size:
                    17px;

            }


            .character-area {

                width:
                    100%;

                height:
                    45%;

                right:
                    0;

                bottom:
                    0;

                align-items:
                    flex-end;

            }


            #character {

                width:
                    190px;

                max-height:
                    100%;

            }


            .navigation {

                gap:
                    12px;

                margin-top:
                    12px;

            }


            .nav-button {

                width:
                    65px;

                height:
                    55px;

                font-size:
                    29px;

            }

                    </div>

                    </div>

                        🎨 Colors
                    </div>

                    <div class="category-count">

                    </div>

                    </div>

                            🐶
                        </span>

                        Find the Animal

                        type="button"
                        class="game-choice"
                        onclick="startGame('memory')"

                        <span>
                            🧩
                        </span>

                        Memory Game

                    </button>

                     JUEGO ACTIVO
                ========================================== -->

                    id="activeGame"
                    style="display:none;"

                        id="gameQuestion"
                        class="game-question"
                    >
                        Find the color!
                    </div>

                        id="gameInstruction"
                        class="game-instruction"

                    </div>

                        type="button"
                        class="speak-button"

                    </button>

                        id="gameOptions"
                        class="game-options"
                        style="margin-top:25px;"
                    >
                    </div>


                    <div
                        id="gameResult"
                        class="game-result"
                    ></div>


                    <button
                        type="button"
                        id="gameNextButton"
                        class="game-next"
                        onclick="nextGameRound()"
                    >
                        Next ⭐
                    </button>


                    <button
                        type="button"
                        class="complete-button categories-button"
                        onclick="showGameMenu()"
                        style="margin-top:20px;"
                    >
                        Mini Games 🎮
                    </button>

                </div>

            </div>

        </section>

                    type="button"
                    class="complete-button menu-button"

            </div>


        </section>


    </main>

</div>

    /* =========================================================

    ========================================================== */

    function loadProgress() {

        try {

            const saved =
                localStorage.getItem(
                    progressStorageKey
                );


            if (
                saved
            ) {

                const loaded =
                    JSON.parse(
                        saved
                    );


                const defaultProgress = {

                    fruits: [],

                    colors: [],

                    objects: [],

                    numbers: [],

                    animals: [],

                    body: [],

                    clothes: [],

                    food: []

                };


                return {
                    ...defaultProgress,
                    ...loaded
                };

            }

        } catch (error) {

            console.log(
                "Progress error:",
                error
            );

        }


        return {

            fruits: [],

            colors: [],

            objects: [],

            numbers: [],

            animals: [],

            body: [],

            clothes: [],

            food: []

        };

    }


    function saveProgress() {

        try {

            localStorage.setItem(
                progressStorageKey,
                JSON.stringify(
                    progress
                )
            );

        } catch (error) {

            console.log(
                "Save progress error:",
                error

    /* =========================================================
       HABLAR
    ========================================================== */

    function speakEnglish(
        text
    ) {

        if (
            !(
                "speechSynthesis"
                in window
            )
        ) {

            return;

        }


        try {

            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            utterance.lang =
                "en-US";


            utterance.rate =
                0.72;


            utterance.pitch =
                1.08;


            utterance.volume =
                1;


            const voices =
                window.speechSynthesis
                    .getVoices();


            const englishVoice =
                voices.find(
                    voice =>
                        voice.lang &&
                        voice.lang
                            .toLowerCase()
                            .startsWith(
                                "en"
                            )
                );


            if (
                englishVoice
            ) {

                utterance.voice =
                    englishVoice;

            }


            window.speechSynthesis.speak(
                utterance
            );

        } catch (error) {

            console.log(
                "Voice error:",
                error
            );

        }

    }

        const data =
            learningData[
                currentCategory

        const word =
            data.words[
                currentIndex
            ];


        if (
            !word
        ) {

            return;

        }


        currentCategoryElement.textContent =
            data.title;


        learningEmoji.textContent =
            word.emoji;


        wordName.textContent =
            word.name;


        const total =
            data.words.length;


        const number =
            currentIndex + 1;


        wordProgress.textContent =
            number +
            " / " +
            total;


        pageIndicator.textContent =
            number +
            " / " +
            total;


        previousButton.disabled =
            currentIndex === 0;


        nextButton.disabled =
            false;


        smallMessage.textContent =
            "";


        /*
         * Reiniciamos animación
         */

        learningEmoji.style.animation =
            "none";


        void learningEmoji.offsetWidth;


        learningEmoji.style.animation =
            "itemAppear 0.4s ease";


        /*
         * Personaje vuelve a aparecer
         */

        character.style.animation =
            "none";


        void character.offsetWidth;


        character.style.animation =
            "characterAppear 0.5s ease";

    }


    /* =========================================================
       SIGUIENTE PALABRA
    ========================================================== */

    function nextWord() {

        if (
            !currentCategory
        ) {

            return;

        }


        const words =
            learningData[
                currentCategory
            ].words;


        /*
         * Guardar como aprendida
         */

        const wordNameKey =
            words[
                currentIndex
            ].name;


        if (
            !progress[
                currentCategory
            ].includes(
                wordNameKey
            )
        ) {

            progress[
                currentCategory
            ].push(
                wordNameKey
            );


            score++;

            updateScore();

            saveProgress();

        }


        /*
         * ¿Es la última?
         */

        if (
            currentIndex >=
            words.length - 1
        ) {

            finishCategory();

            return;

        }


        currentIndex++;


        showWord();


        setTimeout(
            function() {

                speakCurrentWord();

            },
            350
        );

    }

                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "game-option";


                button.innerHTML =

                    `
                    <div class="game-option-emoji">
                        ${item.emoji}
                    </div>

                    <div class="game-option-text">
                        ${item.name}
                    </div>
                    `;

                    "click",
                    function() {

                        checkGameAnswer(
                            item.name,
                            button
                        );

                    }
                );


                gameOptions.appendChild(
                    button
                );

            }
        );

    }


    /* =========================================================
       COMPROBAR RESPUESTA
    ========================================================== */

    function checkGameAnswer(
        answer,
        clickedButton
    ) {

        const buttons =
            gameOptions.querySelectorAll(
                ".game-option"
            );


        buttons.forEach(
            function(button) {

                button.disabled =
                    true;

            }
        );


        if (
            answer ===
            currentGameAnswer
        ) {

            gameResult.textContent =
                "⭐ Correct! Great job!";


            gameResult.className =
                "game-result game-correct";


            gameScore++;


            updateGameScore();


            speakEnglish(
                "Correct! Great job!"
            );

        } else {

            gameResult.textContent =
                "💪 Try again next time!";


            gameResult.className =
                "game-result game-wrong";


            speakEnglish(
                "Try again next time!"
            );

        }


        gameNextButton.style.display =
            "inline-block";

    }


    /* =========================================================
       SIGUIENTE RONDA
    ========================================================== */

    function nextGameRound() {

        currentGameRound++;


        if (
            currentGameRound >= 5
        ) {

            gameQuestion.textContent =
                "🌟 Amazing!";


            gameInstruction.textContent =
                "You finished this mini game!";


            gameOptions.innerHTML =
                "🎉⭐🏆";


            gameOptions.style.fontSize =
                "80px";


            gameResult.textContent =
                "Choose another game or play again!";


            gameNextButton.textContent =
                "Play Again";


            gameNextButton.onclick =
                function() {

                    currentGameRound =
                        0;

                    gameOptions.style.fontSize =
                        "";

                    gameNextButton.textContent =
                        "Next ⭐";

                    gameNextButton.onclick =
                        nextGameRound;

                    createGameRound();

                };


            gameNextButton.style.display =
                "inline-block";


            speakEnglish(
                "Amazing! You finished this mini game!"
            );


            return;

        }


        gameOptions.style.fontSize =
            "";


        createGameRound();

    }


    /* =========================================================
       HABLAR PREGUNTA DEL MINI JUEGO
    ========================================================== */

    function speakGameQuestion() {

        if (
            !currentGameAnswer
        ) {

            return;

        }


        speakEnglish(
            currentGameAnswer
        );

    }


    /* =========================================================
       TECLADO
    ========================================================== */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                learningScreen.style.display !==
                "block"
            ) {

                return;

            }


            if (
                event.key ===
                "ArrowRight"
            ) {

                nextWord();

            }


            if (
                event.key ===
                "ArrowLeft"
            ) {

                previousWord();

            }


            if (
                event.key ===
                " "
            ) {

                event.preventDefault();

                speakCurrentWord();

            }

        }
    );


    /* =========================================================
       TOQUE / SWIPE
    ========================================================== */

    let touchStartX =
        0;


    let touchEndX =
        0;


    document.addEventListener(
        "touchstart",
        function(event) {

            if (
                event.changedTouches.length
                > 0
            ) {

                touchStartX =
                    event.changedTouches[0]
                        .screenX;

            }

        },
        {
            passive: true
        }
    );


    document.addEventListener(
        "touchend",
        function(event) {

            if (
                event.changedTouches.length
                === 0
            ) {

                return;

            }


            touchEndX =
                event.changedTouches[0]
                    .screenX;


            const difference =
                touchEndX -
                touchStartX;


            if (
                Math.abs(
                    difference
                ) < 50
            ) {

                return;

            }


            if (
                difference < 0
            ) {

                nextWord();

            } else {

                previousWord();

            }

        },
        {
            passive: true
        }
    );


    /* =========================================================
       CARGA INICIAL
    ========================================================== */

    window.addEventListener(
        "load",
        function() {

            loadCharacter();


            /*
             * Calculamos el máximo total
             */

            let totalWords =
                0;


            Object.keys(
                learningData
            ).forEach(
                function(category) {

                    totalWords +=
                        learningData[
                            category
                        ].words.length;

                }
            );


            totalScoreElement.textContent =
                totalWords;


            /*
             * Recuperamos palabras ya aprendidas
             */

            score =
                Object.keys(
                    learningData
                ).reduce(
                    function(total, category) {

                        return total +
                            (
                                progress[
                                    category
                                ] || []
                            ).length;

                    },
                    0
                );


            updateScore();


            updateGameScore();

        }
    );


    /* =========================================================
       VOCES DEL NAVEGADOR
    ========================================================== */

    if (
        "speechSynthesis"
        in window
    ) {

        window.speechSynthesis
            .onvoiceschanged =
            function() {

                /*
                 * Las voces quedan disponibles
                 * para speakEnglish().
                 */

            };

    }

</script>
