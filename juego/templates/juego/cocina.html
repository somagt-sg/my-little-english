{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>My Little English - My Kitchen</title>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background: #dcdcdc;

            touch-action: none;
        }


        /* =====================================================
           BARRA SUPERIOR
        ====================================================== */

        .top-bar {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 72px;

            z-index: 5000;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            background:
                linear-gradient(
                    90deg,
                    #ffcf33,
                    #ffb703
                );

            color: #4a3000;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.20);
        }


        .game-title {

            font-size: 26px;

            font-weight: bold;

            white-space: nowrap;
        }


        .mission {

            font-size: 18px;

            font-weight: bold;

            text-align: center;
        }


        .stars {

            font-size: 20px;

            font-weight: bold;

            white-space: nowrap;
        }



        /* =====================================================
           CONTENEDOR DEL JUEGO
        ====================================================== */

        .game-container {

            position: fixed;

            top: 72px;
            left: 0;
            right: 0;
            bottom: 0;

            overflow: hidden;

            background: #dcdcdc;

            touch-action: none;
        }



        /* =====================================================
           ÁREA DE DESPLAZAMIENTO
        ====================================================== */

        #roomScroll {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            overflow: auto;

            scrollbar-width: none;

            -ms-overflow-style: none;

            touch-action: none;

            overscroll-behavior: none;

            -webkit-overflow-scrolling: touch;
        }


        #roomScroll::-webkit-scrollbar {
            display: none;
        }



        /* =====================================================
           TAMAÑO REAL DE LA COCINA
        ====================================================== */

        #roomSizer {

            position: relative;

            width: 1536px;
            height: 1024px;

            flex-shrink: 0;
        }



        /* =====================================================
           IMAGEN / HABITACIÓN
        ====================================================== */

        #room {

            position: absolute;

            left: 0;
            top: 0;

            width: 1536px;
            height: 1024px;

            transform-origin: top left;

            background-image:
                url("{% static 'juego/images/my-kitchen.jpeg' %}");

            background-size:
                1536px 1024px;

            background-repeat: no-repeat;

            background-position:
                top left;
        }



        /* =====================================================
           PERSONAJE
        ====================================================== */

        #character {

            position: absolute;

            left: 120px;
            bottom: 45px;

            width: 150px;
            height: 205px;

            object-fit: contain;

            z-index: 300;

            pointer-events: none;

            user-select: none;

            -webkit-user-select: none;
        }


        #character.girl-character {

            width: 220px;
            height: 300px;

            bottom: 15px;
        }



        /* =====================================================
           ZONAS DE LOS OBJETOS
        ====================================================== */

        .hotspot {

            position: absolute;

            z-index: 1000;

            display: block;

            cursor: pointer;

            background:
                transparent;

            border-radius: 22px;

            user-select: none;

            -webkit-user-select: none;

            touch-action: none;

            pointer-events: auto;

            -webkit-touch-callout: none;
        }


        .hotspot.found {

            background:
                rgba(76,175,80,0.25);

            box-shadow:
                0 0 0 4px rgba(76,175,80,0.60),
                0 0 22px rgba(76,175,80,0.80);
        }



        /* =====================================================
           APPLE
        ====================================================== */

        .apple {

            left: 790px;
            top: 555px;

            width: 150px;
            height: 135px;
        }



        /* =====================================================
           BREAD
        ====================================================== */

        .bread {

            left: 875px;
            top: 520px;

            width: 205px;
            height: 145px;
        }



        /* =====================================================
           EGGS
        ====================================================== */

        .eggs {

            left: 1050px;
            top: 545px;

            width: 165px;
            height: 140px;
        }



        /* =====================================================
           CUP
        ====================================================== */

        .cup {

            left: 1035px;
            top: 635px;

            width: 135px;
            height: 135px;
        }



        /* =====================================================
           BOWL
        ====================================================== */

        .bowl {

            left: 1170px;
            top: 635px;

            width: 175px;
            height: 145px;
        }



        /* =====================================================
           GLASS
        ====================================================== */

        .glass {

            left: 1285px;
            top: 640px;

            width: 140px;
            height: 175px;
        }



        /* =====================================================
           SPOON
        ====================================================== */

        .spoon {

            left: 905px;
            top: 650px;

            width: 115px;
            height: 180px;
        }



        /* =====================================================
           FORK
        ====================================================== */

        .fork {

            left: 975px;
            top: 650px;

            width: 115px;
            height: 180px;
        }



        /* =====================================================
           KNIFE
        ====================================================== */

        .knife {

            left: 1040px;
            top: 650px;

            width: 115px;
            height: 185px;
        }



        /* =====================================================
           REFRIGERATOR
        ====================================================== */

        .refrigerator {

            left: 65px;
            top: 15px;

            width: 260px;
            height: 850px;
        }



        /* =====================================================
           MENSAJE
        ====================================================== */

        #feedback {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.80);

            z-index: 6000;

            width: max-content;

            max-width: 90%;

            padding: 25px 40px;

            background:
                rgba(255,255,255,0.97);

            border-radius: 25px;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.30);

            font-size: 32px;

            font-weight: bold;

            color: #198754;

            text-align: center;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }


        #feedback.show {

            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }



        /* =====================================================
           CONTROLES
        ====================================================== */

        .controls {

            position: fixed;

            left: 0;
            right: 0;

            bottom: 18px;

            z-index: 5500;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            pointer-events: none;
        }


        .control-button {

            pointer-events: auto;

            width: 65px;
            height: 65px;

            border: none;

            border-radius: 50%;

            background: #198754;

            color: white;

            font-size: 30px;

            font-weight: bold;

            box-shadow:
                0 5px 12px rgba(0,0,0,0.25);

            cursor: pointer;

            user-select: none;

            -webkit-user-select: none;

            touch-action: manipulation;
        }


        .control-button:active {

            transform: scale(0.92);
        }


        .continue-button {

            width: auto;

            min-width: 150px;

            height: 58px;

            padding: 0 24px;

            border-radius: 30px;

            background: #ff9800;

            font-size: 18px;
        }



        /* =====================================================
           CELULAR
        ====================================================== */

        @media (max-width: 700px) {

            .top-bar {

                height: 60px;

                padding: 0 10px;
            }


            .game-container {

                top: 60px;
            }


            .game-title {

                font-size: 17px;
            }


            .mission {

                font-size: 13px;
            }


            .stars {

                font-size: 14px;
            }


            .control-button {

                width: 58px;
                height: 58px;

                font-size: 26px;
            }


            .continue-button {

                min-width: 125px;

                height: 52px;

                padding: 0 16px;

                font-size: 15px;
            }


            .controls {

                bottom: 10px;

                gap: 8px;
            }


            #feedback {

                width: 85%;

                padding: 20px;

                font-size: 24px;
            }


            #character {

                width: 150px;
                height: 205px;

                bottom: 45px;
            }


            #character.girl-character {

                width: 220px;
                height: 300px;

                bottom: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BARRA SUPERIOR
    ====================================================== -->

    <div class="top-bar">

        <div class="game-title">
            🍳 My Kitchen
        </div>


        <div class="mission">
            Find the objects!
        </div>


        <div class="stars">
            ⭐ <span id="score">0</span>/10
        </div>

    </div>



    <!-- =====================================================
         JUEGO
    ====================================================== -->

    <div class="game-container">

        <div id="roomScroll">

            <div id="roomSizer">

                <div id="room">


                    <!-- =================================================
                         PERSONAJE
                    ================================================== -->

                    <img
                        id="character"
                        src="{% static 'juego/images/personaje-niño.png' %}"
                        alt="Character"
                        draggable="false"
                    >



                    <!-- =================================================
                         APPLE
                    ================================================== -->

                    <div
                        class="hotspot apple"
                        data-object="apple"
                        data-word="Apple"
                        data-sentence="This is an apple."
                        aria-label="Apple"
                    ></div>



                    <!-- =================================================
                         BREAD
                    ================================================== -->

                    <div
                        class="hotspot bread"
                        data-object="bread"
                        data-word="Bread"
                        data-sentence="This is bread."
                        aria-label="Bread"
                    ></div>



                    <!-- =================================================
                         EGGS
                    ================================================== -->

                    <div
                        class="hotspot eggs"
                        data-object="eggs"
                        data-word="Eggs"
                        data-sentence="These are eggs."
                        aria-label="Eggs"
                    ></div>



                    <!-- =================================================
                         CUP
                    ================================================== -->

                    <div
                        class="hotspot cup"
                        data-object="cup"
                        data-word="Cup"
                        data-sentence="This is a cup."
                        aria-label="Cup"
                    ></div>



                    <!-- =================================================
                         BOWL
                    ================================================== -->

                    <div
                        class="hotspot bowl"
                        data-object="bowl"
                        data-word="Bowl"
                        data-sentence="This is a bowl."
                        aria-label="Bowl"
                    ></div>



                    <!-- =================================================
                         GLASS
                    ================================================== -->

                    <div
                        class="hotspot glass"
                        data-object="glass"
                        data-word="Glass"
                        data-sentence="This is a glass."
                        aria-label="Glass"
                    ></div>



                    <!-- =================================================
                         SPOON
                    ================================================== -->

                    <div
                        class="hotspot spoon"
                        data-object="spoon"
                        data-word="Spoon"
                        data-sentence="This is a spoon."
                        aria-label="Spoon"
                    ></div>



                    <!-- =================================================
                         FORK
                    ================================================== -->

                    <div
                        class="hotspot fork"
                        data-object="fork"
                        data-word="Fork"
                        data-sentence="This is a fork."
                        aria-label="Fork"
                    ></div>



                    <!-- =================================================
                         KNIFE
                    ================================================== -->

                    <div
                        class="hotspot knife"
                        data-object="knife"
                        data-word="Knife"
                        data-sentence="This is a knife."
                        aria-label="Knife"
                    ></div>



                    <!-- =================================================
                         REFRIGERATOR
                    ================================================== -->

                    <div
                        class="hotspot refrigerator"
                        data-object="refrigerator"
                        data-word="Refrigerator"
                        data-sentence="This is a refrigerator."
                        aria-label="Refrigerator"
                    ></div>


                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
         FEEDBACK
    ====================================================== -->

    <div id="feedback">
        ⭐ Great job! ⭐
    </div>



    <!-- =====================================================
         CONTROLES
    ====================================================== -->

    <div class="controls">

        <button
            type="button"
            class="control-button"
            id="leftButton"
            aria-label="Move left"
        >
            ←
        </button>


        <button
            type="button"
            class="control-button continue-button"
            id="continueButton"
        >
            Continue ➜
        </button>


        <button
            type="button"
            class="control-button"
            id="rightButton"
            aria-label="Move right"
        >
            →
        </button>

    </div>



    <script>

        /* =====================================================
           ELEMENTOS
        ====================================================== */

        const roomScroll =
            document.getElementById("roomScroll");

        const roomSizer =
            document.getElementById("roomSizer");

        const room =
            document.getElementById("room");

        const character =
            document.getElementById("character");

        const scoreElement =
            document.getElementById("score");

        const feedback =
            document.getElementById("feedback");

        const leftButton =
            document.getElementById("leftButton");

        const rightButton =
            document.getElementById("rightButton");

        const continueButton =
            document.getElementById("continueButton");



        /* =====================================================
           PERSONAJE NIÑO / NIÑA
        ====================================================== */

        const selectedCharacter =
            localStorage.getItem(
                "myLittleEnglishCharacter"
            );


        if (
            selectedCharacter === "girl" ||
            selectedCharacter === "niña" ||
            selectedCharacter === "nina"
        ) {

            character.src =
                "{% static 'juego/images/personaje-niña.png' %}";

            character.classList.add(
                "girl-character"
            );

        } else {

            character.src =
                "{% static 'juego/images/personaje-niño.png' %}";

            character.classList.remove(
                "girl-character"
            );

        }



        /* =====================================================
           ZOOM
        ====================================================== */

        let zoom = 1;

        const MIN_ZOOM = 0.55;

        const MAX_ZOOM = 2.20;


        function updateZoom() {

            room.style.transform =
                "scale(" + zoom + ")";


            roomSizer.style.width =
                (1536 * zoom) + "px";


            roomSizer.style.height =
                (1024 * zoom) + "px";

        }


        updateZoom();



        /* =====================================================
           MOVIMIENTO DEL PERSONAJE
        ====================================================== */

        let characterX = 120;

        const movementSpeed = 7;


        function moveCharacter(direction) {

            characterX +=
                direction *
                movementSpeed;


            const maxX =
                1536 -
                character.offsetWidth -
                20;


            if (characterX < 0) {

                characterX = 0;
            }


            if (characterX > maxX) {

                characterX = maxX;
            }


            character.style.left =
                characterX + "px";


            const viewportWidth =
                roomScroll.clientWidth;


            const currentScroll =
                roomScroll.scrollLeft;


            const characterCenter =
                (
                    characterX +
                    character.offsetWidth / 2
                ) * zoom;


            const leftLimit =
                currentScroll +
                viewportWidth * 0.30;


            const rightLimit =
                currentScroll +
                viewportWidth * 0.70;


            if (
                characterCenter >
                rightLimit
            ) {

                roomScroll.scrollLeft +=
                    characterCenter -
                    rightLimit;
            }


            if (
                characterCenter <
                leftLimit
            ) {

                roomScroll.scrollLeft -=
                    leftLimit -
                    characterCenter;
            }

        }



        /* =====================================================
           BOTONES DEL PERSONAJE
        ====================================================== */

        leftButton.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                moveCharacter(-1);

            }
        );


        rightButton.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                moveCharacter(1);

            }
        );



        /* =====================================================
           TECLADO
        ====================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    event.preventDefault();

                    moveCharacter(-1);
                }


                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    event.preventDefault();

                    moveCharacter(1);
                }

            }
        );



        /* =====================================================
           OBJETOS
        ====================================================== */

        const storageKey =
            "myKitchenFoundObjects";


        let foundObjects = [];


        try {

            foundObjects =
                JSON.parse(
                    localStorage.getItem(
                        storageKey
                    )
                ) || [];

        } catch (error) {

            foundObjects = [];
        }



        /* =====================================================
           ACTUALIZAR PUNTAJE
        ====================================================== */

        function updateScore() {

            scoreElement.textContent =
                foundObjects.length;


            document
                .querySelectorAll(".hotspot")
                .forEach(
                    function(hotspot) {

                        const objectName =
                            hotspot.dataset.object;


                        if (
                            foundObjects.includes(
                                objectName
                            )
                        ) {

                            hotspot.classList.add(
                                "found"
                            );

                        }

                    }
                );

        }



        /* =====================================================
           ENCONTRAR OBJETO
        ====================================================== */

        function findObject(hotspot) {

            if (!hotspot) {
                return;
            }


            const objectName =
                hotspot.dataset.object;

            const word =
                hotspot.dataset.word;

            const sentence =
                hotspot.dataset.sentence;


            if (
                foundObjects.includes(
                    objectName
                )
            ) {

                speak(word);

                showFeedback(
                    "⭐ " + word + " ⭐"
                );

                return;
            }


            foundObjects.push(
                objectName
            );


            localStorage.setItem(
                storageKey,
                JSON.stringify(
                    foundObjects
                )
            );


            hotspot.classList.add(
                "found"
            );


            updateScore();


            speak(sentence);


            showFeedback(
                "⭐ " +
                word +
                "! ⭐"
            );


            if (
                foundObjects.length >= 10
            ) {

                setTimeout(
                    function() {

                        showFeedback(
                            "🎉 Great job! You found all 10 objects! 🎉"
                        );

                    },
                    1300
                );

            }

        }



        /* =====================================================
           POINTER EVENTS
           
           ESTA PARTE ES LA IMPORTANTE:
           
           - 1 dedo sobre objeto = objeto
           - 1 dedo fuera de objeto = desplazamiento
           - 2 dedos = zoom
        ====================================================== */

        const activePointers =
            new Map();


        let draggingRoom = false;

        let dragStartX = 0;

        let dragStartY = 0;

        let dragScrollLeft = 0;

        let dragScrollTop = 0;

        let dragMoved = false;

        let activeHotspot = null;


        let pinchStartDistance = 0;

        let pinchStartZoom = 1;

        let pinchCenterX = 0;

        let pinchCenterY = 0;



        function distanceBetween(
            point1,
            point2
        ) {

            const dx =
                point2.clientX -
                point1.clientX;

            const dy =
                point2.clientY -
                point1.clientY;


            return Math.sqrt(
                dx * dx +
                dy * dy
            );

        }



        function centerBetween(
            point1,
            point2
        ) {

            return {

                x:
                    (
                        point1.clientX +
                        point2.clientX
                    ) / 2,

                y:
                    (
                        point1.clientY +
                        point2.clientY
                    ) / 2

            };

        }



        roomScroll.addEventListener(
            "pointerdown",
            function(event) {

                if (
                    event.pointerType === "mouse" &&
                    event.button !== 0
                ) {

                    return;
                }


                activePointers.set(
                    event.pointerId,
                    event
                );


                const hotspot =
                    event.target.closest(
                        ".hotspot"
                    );


                /* -------------------------------------
                   SI TOCÓ UN OBJETO
                -------------------------------------- */

                if (
                    hotspot &&
                    activePointers.size === 1
                ) {

                    activeHotspot =
                        hotspot;

                    draggingRoom = false;

                    dragMoved = false;


                    dragStartX =
                        event.clientX;

                    dragStartY =
                        event.clientY;


                    return;
                }


                /* -------------------------------------
                   SI TOCÓ LA COCINA
                -------------------------------------- */

                if (
                    activePointers.size === 1
                ) {

                    activeHotspot = null;

                    draggingRoom = true;

                    dragMoved = false;


                    dragStartX =
                        event.clientX;

                    dragStartY =
                        event.clientY;


                    dragScrollLeft =
                        roomScroll.scrollLeft;

                    dragScrollTop =
                        roomScroll.scrollTop;

                }


                /* -------------------------------------
                   DOS DEDOS = ZOOM
                -------------------------------------- */

                if (
                    activePointers.size === 2
                ) {

                    draggingRoom = false;

                    activeHotspot = null;

                    dragMoved = true;


                    const points =
                        Array.from(
                            activePointers.values()
                        );


                    pinchStartDistance =
                        distanceBetween(
                            points[0],
                            points[1]
                        );


                    pinchStartZoom =
                        zoom;


                    const center =
                        centerBetween(
                            points[0],
                            points[1]
                        );


                    pinchCenterX =
                        center.x;

                    pinchCenterY =
                        center.y;

                }

            },
            {
                passive: false
            }
        );



        roomScroll.addEventListener(
            "pointermove",
            function(event) {

                if (
                    !activePointers.has(
                        event.pointerId
                    )
                ) {

                    return;
                }


                activePointers.set(
                    event.pointerId,
                    event
                );


                /* =====================================
                   DOS DEDOS = ZOOM
                ====================================== */

                if (
                    activePointers.size >= 2
                ) {

                    event.preventDefault();


                    const points =
                        Array.from(
                            activePointers.values()
                        );


                    const currentDistance =
                        distanceBetween(
                            points[0],
                            points[1]
                        );


                    if (
                        pinchStartDistance <= 0
                    ) {

                        return;
                    }


                    let newZoom =
                        pinchStartZoom *
                        (
                            currentDistance /
                            pinchStartDistance
                        );


                    newZoom =
                        Math.max(
                            MIN_ZOOM,
                            Math.min(
                                MAX_ZOOM,
                                newZoom
                            )
                        );


                    const oldZoom =
                        zoom;


                    const center =
                        centerBetween(
                            points[0],
                            points[1]
                        );


                    const contentX =
                        (
                            roomScroll.scrollLeft +
                            center.x
                        ) / oldZoom;


                    const contentY =
                        (
                            roomScroll.scrollTop +
                            center.y
                        ) / oldZoom;


                    zoom =
                        newZoom;


                    updateZoom();


                    roomScroll.scrollLeft =
                        (
                            contentX *
                            zoom
                        ) -
                        center.x;


                    roomScroll.scrollTop =
                        (
                            contentY *
                            zoom
                        ) -
                        center.y;


                    return;
                }



                /* =====================================
                   UN DEDO = DESPLAZAMIENTO
                ====================================== */

                if (
                    activePointers.size === 1 &&
                    draggingRoom
                ) {

                    event.preventDefault();


                    const deltaX =
                        event.clientX -
                        dragStartX;


                    const deltaY =
                        event.clientY -
                        dragStartY;


                    if (
                        Math.abs(deltaX) > 8 ||
                        Math.abs(deltaY) > 8
                    ) {

                        dragMoved = true;
                    }


                    roomScroll.scrollLeft =
                        dragScrollLeft -
                        deltaX;


                    roomScroll.scrollTop =
                        dragScrollTop -
                        deltaY;

                }



                /* =====================================
                   DEDO SOBRE OBJETO
                ====================================== */

                if (
                    activeHotspot &&
                    activePointers.size === 1
                ) {

                    const deltaX =
                        event.clientX -
                        dragStartX;


                    const deltaY =
                        event.clientY -
                        dragStartY;


                    if (
                        Math.abs(deltaX) > 10 ||
                        Math.abs(deltaY) > 10
                    ) {

                        dragMoved = true;

                    }

                }

            },
            {
                passive: false
            }
        );



        roomScroll.addEventListener(
            "pointerup",
            function(event) {

                const wasHotspot =
                    activeHotspot;

                const didMove =
                    dragMoved;


                activePointers.delete(
                    event.pointerId
                );


                /* -------------------------------------
                   TOQUE CORTO SOBRE OBJETO
                -------------------------------------- */

                if (
                    wasHotspot &&
                    !didMove &&
                    activePointers.size === 0
                ) {

                    findObject(
                        wasHotspot
                    );

                }


                /* -------------------------------------
                   LIMPIAR
                -------------------------------------- */

                if (
                    activePointers.size === 0
                ) {

                    draggingRoom = false;

                    activeHotspot = null;

                    dragMoved = false;

                    pinchStartDistance = 0;

                }


                /* -------------------------------------
                   SI QUEDA UN DEDO DESPUÉS DEL ZOOM
                -------------------------------------- */

                if (
                    activePointers.size === 1
                ) {

                    const remaining =
                        Array.from(
                            activePointers.values()
                        )[0];


                    draggingRoom = true;

                    activeHotspot = null;

                    dragMoved = false;


                    dragStartX =
                        remaining.clientX;

                    dragStartY =
                        remaining.clientY;


                    dragScrollLeft =
                        roomScroll.scrollLeft;

                    dragScrollTop =
                        roomScroll.scrollTop;

                }

            },
            {
                passive: false
            }
        );



        roomScroll.addEventListener(
            "pointercancel",
            function(event) {

                activePointers.delete(
                    event.pointerId
                );


                if (
                    activePointers.size === 0
                ) {

                    draggingRoom = false;

                    activeHotspot = null;

                    dragMoved = false;

                }

            }
        );



        /* =====================================================
           EVITAR ARRASTRE DE IMÁGENES
        ====================================================== */

        document
            .querySelectorAll("img")
            .forEach(
                function(image) {

                    image.addEventListener(
                        "dragstart",
                        function(event) {

                            event.preventDefault();

                        }
                    );

                }
            );



        /* =====================================================
           VOZ
        ====================================================== */

        function speak(text) {

            if (
                !(
                    "speechSynthesis"
                    in window
                )
            ) {

                return;
            }


            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            utterance.lang =
                "en-US";


            utterance.rate =
                0.72;


            utterance.pitch =
                1.08;


            const voices =
                window.speechSynthesis
                    .getVoices();


            const englishVoice =
                voices.find(
                    function(voice) {

                        return (
                            voice.lang &&
                            voice.lang
                                .toLowerCase()
                                .startsWith("en")
                        );

                    }
                );


            if (
                englishVoice
            ) {

                utterance.voice =
                    englishVoice;
            }


            window.speechSynthesis.speak(
                utterance
            );

        }



        /* =====================================================
           FEEDBACK
        ====================================================== */

        let feedbackTimer;


        function showFeedback(message) {

            feedback.textContent =
                message;


            feedback.classList.add(
                "show"
            );


            clearTimeout(
                feedbackTimer
            );


            feedbackTimer =
                setTimeout(
                    function() {

                        feedback.classList.remove(
                            "show"
                        );

                    },
                    1300
                );

        }



        /* =====================================================
           CONTINUAR
        ====================================================== */

        continueButton.addEventListener(
            "pointerdown",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

            }
        );


        continueButton.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();


                window.location.href =
                    "/habitacion/";

            }
        );



        /* =====================================================
           CARGAR DATOS
        ====================================================== */

        updateScore();


    </script>

</body>
