{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>My Little English - My Kitchen</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            touch-action: pan-x;
        }

        /* =========================
           BARRA SUPERIOR
        ========================== */

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 72px;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            background: linear-gradient(
                90deg,
                #ffcf33,
                #ffb703
            );

            color: #4a3000;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .game-title {
            font-size: 26px;
            font-weight: bold;
            white-space: nowrap;
        }

        .mission {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .stars {
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* =========================
           CONTENEDOR DEL JUEGO
        ========================== */

        .game-container {
            position: fixed;
            top: 72px;
            left: 0;
            right: 0;
            bottom: 0;

            overflow: hidden;

            background: #ddd;

            touch-action: pan-x;
        }

        /* =========================
           MUNDO / HABITACIÓN
        ========================== */

        .room-scroll {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;

            touch-action: pan-x;

            scrollbar-width: none;
        }

        .room-scroll::-webkit-scrollbar {
            display: none;
        }

        .room {
            position: relative;

            width: 1536px;
            height: 1024px;

            min-width: 1536px;
            min-height: 1024px;

            background-image: url("{% static 'juego/images/my-kitchen.jpeg' %}");
            background-size: 1536px 1024px;
            background-repeat: no-repeat;
            background-position: top left;
        }

        /* =========================
           PERSONAJE
        ========================== */

        #character {
            position: absolute;

            left: 120px;
            bottom: 45px;

            width: 150px;
            height: 205px;

            object-fit: contain;

            z-index: 100;

            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
        }

        #character.girl-character {
            width: 220px;
            height: 300px;
            bottom: 15px;
        }

        /* =========================
           OBJETOS
        ========================== */

        .hotspot {
            position: absolute;

            cursor: pointer;

            z-index: 50;

            border-radius: 20px;

            touch-action: manipulation;

            user-select: none;
            -webkit-user-select: none;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .hotspot:hover {
            background: rgba(255, 255, 0, 0.12);
        }

        .hotspot.found {
            background: rgba(76, 175, 80, 0.25);
            box-shadow:
                0 0 0 4px rgba(76, 175, 80, 0.5),
                0 0 20px rgba(76, 175, 80, 0.8);
        }

        /* =========================
           1. APPLE
        ========================== */

        .apple {
            left: 815px;
            top: 570px;
            width: 115px;
            height: 105px;
        }

        /* =========================
           2. BREAD
        ========================== */

        .bread {
            left: 900px;
            top: 535px;
            width: 180px;
            height: 120px;
        }

        /* =========================
           3. EGGS
        ========================== */

        .eggs {
            left: 1080px;
            top: 565px;
            width: 135px;
            height: 105px;
        }

        /* =========================
           4. CUP
        ========================== */

        .cup {
            left: 1060px;
            top: 650px;
            width: 105px;
            height: 105px;
        }

        /* =========================
           5. BOWL
        ========================== */

        .bowl {
            left: 1190px;
            top: 660px;
            width: 150px;
            height: 115px;
        }

        /* =========================
           6. GLASS
        ========================== */

        .glass {
            left: 1310px;
            top: 660px;
            width: 100px;
            height: 145px;
        }

        /* =========================
           7. SPOON
        ========================== */

        .spoon {
            left: 930px;
            top: 675px;
            width: 85px;
            height: 155px;

            transform: rotate(-25deg);
        }

        /* =========================
           8. FORK
        ========================== */

        .fork {
            left: 1000px;
            top: 675px;
            width: 85px;
            height: 155px;

            transform: rotate(-25deg);
        }

        /* =========================
           9. KNIFE
        ========================== */

        .knife {
            left: 1070px;
            top: 670px;
            width: 85px;
            height: 160px;

            transform: rotate(-25deg);
        }

        /* =========================
           10. REFRIGERATOR
        ========================== */

        .refrigerator {
            left: 90px;
            top: 25px;
            width: 225px;
            height: 825px;
        }

        /* =========================
           MENSAJE DE ACIERTO
        ========================== */

        #feedback {
            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%) scale(0.8);

            z-index: 2000;

            padding: 25px 40px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 25px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.3);

            font-size: 32px;
            font-weight: bold;

            color: #198754;

            opacity: 0;
            pointer-events: none;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;

            text-align: center;
        }

        #feedback.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* =========================
           CONTROLES
        ========================== */

        .controls {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 18px;

            z-index: 1500;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 15px;

            pointer-events: none;
        }

        .control-button {
            pointer-events: auto;

            width: 65px;
            height: 65px;

            border: none;
            border-radius: 50%;

            background: #198754;
            color: white;

            font-size: 30px;
            font-weight: bold;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.25);

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;

            touch-action: manipulation;
        }

        .control-button:active {
            transform: scale(0.92);
        }

        .continue-button {
            width: auto;
            min-width: 150px;

            height: 58px;

            padding: 0 24px;

            border-radius: 30px;

            background: #ff9800;

            font-size: 18px;
        }

        /* =========================
           CELULAR
        ========================== */

        @media (max-width: 700px) {

            .top-bar {
                height: 60px;
                padding: 0 10px;
            }

            .game-title {
                font-size: 17px;
            }

            .mission {
                font-size: 13px;
            }

            .stars {
                font-size: 14px;
            }

            .game-container {
                top: 60px;
            }

            .room-scroll {
                touch-action: pan-x;
                overflow-x: auto;
            }

            .control-button {
                width: 58px;
                height: 58px;
                font-size: 26px;
            }

            .continue-button {
                min-width: 125px;
                height: 52px;
                padding: 0 16px;
                font-size: 15px;
            }

            #feedback {
                width: 85%;
                padding: 20px;

                font-size: 24px;
            }

            #character {
                width: 150px;
                height: 205px;
                bottom: 45px;
            }

            #character.girl-character {
                width: 210px;
                height: 285px;
                bottom: 15px;
            }

            .controls {
                bottom: 10px;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         BARRA SUPERIOR
    ========================== -->

    <div class="top-bar">

        <div class="game-title">
            🍳 My Kitchen
        </div>

        <div class="mission">
            Find the objects!
        </div>

        <div class="stars">
            ⭐ <span id="score">0</span>/10
        </div>

    </div>


    <!-- =========================
         JUEGO
    ========================== -->

    <div class="game-container">

        <div
            class="room-scroll"
            id="roomScroll"
        >

            <div
                class="room"
                id="room"
            >

                <!-- PERSONAJE -->

                <img
                    id="character"
                    src="{% static 'juego/images/personaje-niño.png' %}"
                    alt="Character"
                    draggable="false"
                >


                <!-- =========================
                     OBJETOS
                ========================== -->

                <div
                    class="hotspot apple"
                    data-object="apple"
                    data-word="Apple"
                    data-sentence="This is an apple."
                    aria-label="Apple"
                ></div>


                <div
                    class="hotspot bread"
                    data-object="bread"
                    data-word="Bread"
                    data-sentence="This is bread."
                    aria-label="Bread"
                ></div>


                <div
                    class="hotspot eggs"
                    data-object="eggs"
                    data-word="Eggs"
                    data-sentence="These are eggs."
                    aria-label="Eggs"
                ></div>


                <div
                    class="hotspot cup"
                    data-object="cup"
                    data-word="Cup"
                    data-sentence="This is a cup."
                    aria-label="Cup"
                ></div>


                <div
                    class="hotspot bowl"
                    data-object="bowl"
                    data-word="Bowl"
                    data-sentence="This is a bowl."
                    aria-label="Bowl"
                ></div>


                <div
                    class="hotspot glass"
                    data-object="glass"
                    data-word="Glass"
                    data-sentence="This is a glass."
                    aria-label="Glass"
                ></div>


                <div
                    class="hotspot spoon"
                    data-object="spoon"
                    data-word="Spoon"
                    data-sentence="This is a spoon."
                    aria-label="Spoon"
                ></div>


                <div
                    class="hotspot fork"
                    data-object="fork"
                    data-word="Fork"
                    data-sentence="This is a fork."
                    aria-label="Fork"
                ></div>


                <div
                    class="hotspot knife"
                    data-object="knife"
                    data-word="Knife"
                    data-sentence="This is a knife."
                    aria-label="Knife"
                ></div>


                <div
                    class="hotspot refrigerator"
                    data-object="refrigerator"
                    data-word="Refrigerator"
                    data-sentence="This is a refrigerator."
                    aria-label="Refrigerator"
                ></div>

            </div>

        </div>

    </div>


    <!-- =========================
         MENSAJE
    ========================== -->

    <div id="feedback">
        ⭐ Great job! ⭐
    </div>


    <!-- =========================
         CONTROLES
    ========================== -->

    <div class="controls">

        <button
            type="button"
            class="control-button"
            id="leftButton"
            aria-label="Move left"
        >
            ←
        </button>


        <button
            type="button"
            class="control-button continue-button"
            id="continueButton"
        >
            Continue ➜
        </button>


        <button
            type="button"
            class="control-button"
            id="rightButton"
            aria-label="Move right"
        >
            →
        </button>

    </div>


    <script>

        /* =====================================================
           ELEMENTOS
        ====================================================== */

        const roomScroll =
            document.getElementById("roomScroll");

        const room =
            document.getElementById("room");

        const character =
            document.getElementById("character");

        const scoreElement =
            document.getElementById("score");

        const feedback =
            document.getElementById("feedback");

        const leftButton =
            document.getElementById("leftButton");

        const rightButton =
            document.getElementById("rightButton");

        const continueButton =
            document.getElementById("continueButton");


        /* =====================================================
           PERSONAJE NIÑO / NIÑA
        ====================================================== */

        const selectedCharacter =
            localStorage.getItem("myLittleEnglishCharacter");

        if (
            selectedCharacter === "girl" ||
            selectedCharacter === "niña" ||
            selectedCharacter === "nina"
        ) {

            character.src =
                "{% static 'juego/images/personaje-niña.png' %}";

            character.classList.add("girl-character");

        } else {

            character.src =
                "{% static 'juego/images/personaje-niño.png' %}";

            character.classList.remove("girl-character");
        }


        /* =====================================================
           MOVIMIENTO DEL PERSONAJE
        ====================================================== */

        let characterX = 120;

        const movementSpeed = 7;


        function moveCharacter(direction) {

            characterX += direction * movementSpeed;

            const maxX =
                room.offsetWidth -
                character.offsetWidth -
                20;

            if (characterX < 0) {
                characterX = 0;
            }

            if (characterX > maxX) {
                characterX = maxX;
            }

            character.style.left =
                characterX + "px";


            /* Auto desplazamiento de la pantalla */

            const viewportWidth =
                roomScroll.clientWidth;

            const currentScroll =
                roomScroll.scrollLeft;

            const characterCenter =
                characterX +
                character.offsetWidth / 2;


            const leftLimit =
                currentScroll +
                viewportWidth * 0.30;

            const rightLimit =
                currentScroll +
                viewportWidth * 0.70;


            if (characterCenter > rightLimit) {

                roomScroll.scrollLeft +=
                    characterCenter -
                    rightLimit;

            }


            if (characterCenter < leftLimit) {

                roomScroll.scrollLeft -=
                    leftLimit -
                    characterCenter;

            }

        }


        /* =====================================================
           BOTONES
        ====================================================== */

        leftButton.addEventListener(
            "pointerdown",
            function (event) {

                event.preventDefault();

                moveCharacter(-1);
            }
        );


        rightButton.addEventListener(
            "pointerdown",
            function (event) {

                event.preventDefault();

                moveCharacter(1);
            }
        );


        /* =====================================================
           TECLADO PC
        ====================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    event.preventDefault();

                    moveCharacter(-1);
                }


                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    event.preventDefault();

                    moveCharacter(1);
                }

            }
        );


        /* =====================================================
           DESPLAZAMIENTO TÁCTIL
           
           IMPORTANTE:
           El usuario puede deslizar el dedo directamente
           sobre la cocina para desplazarse horizontalmente.
        ====================================================== */

        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartScrollLeft = 0;

        let isTouchScrolling = false;


        roomScroll.addEventListener(
            "touchstart",
            function (event) {

                if (
                    !event.touches ||
                    event.touches.length !== 1
                ) {
                    return;
                }

                touchStartX =
                    event.touches[0].clientX;

                touchStartY =
                    event.touches[0].clientY;

                touchStartScrollLeft =
                    roomScroll.scrollLeft;

                isTouchScrolling = false;

            },
            {
                passive: true
            }
        );


        roomScroll.addEventListener(
            "touchmove",
            function (event) {

                if (
                    !event.touches ||
                    event.touches.length !== 1
                ) {
                    return;
                }

                const currentX =
                    event.touches[0].clientX;

                const currentY =
                    event.touches[0].clientY;

                const deltaX =
                    currentX - touchStartX;

                const deltaY =
                    currentY - touchStartY;


                /*
                 * Si el movimiento es principalmente
                 * horizontal, desplazamos la cocina.
                 */

                if (
                    Math.abs(deltaX) >
                    Math.abs(deltaY)
                ) {

                    isTouchScrolling = true;

                    roomScroll.scrollLeft =
                        touchStartScrollLeft -
                        deltaX;

                    /*
                     * Evitamos que el navegador
                     * convierta el gesto horizontal
                     * en otro comportamiento.
                     */

                    event.preventDefault();
                }

            },
            {
                passive: false
            }
        );


        roomScroll.addEventListener(
            "touchend",
            function () {

                isTouchScrolling = false;

            },
            {
                passive: true
            }
        );


        /* =====================================================
           EVITAR QUE UN SWIPE ABRA UN OBJETO
        ====================================================== */

        let objectTouchStartX = 0;
        let objectTouchStartY = 0;


        document.querySelectorAll(
            ".hotspot"
        ).forEach(
            function (hotspot) {

                hotspot.addEventListener(
                    "touchstart",
                    function (event) {

                        if (
                            event.touches.length === 1
                        ) {

                            objectTouchStartX =
                                event.touches[0].clientX;

                            objectTouchStartY =
                                event.touches[0].clientY;
                        }

                    },
                    {
                        passive: true
                    }
                );


                hotspot.addEventListener(
                    "click",
                    function () {

                        /*
                         * Si el usuario estaba
                         * deslizando, no activamos
                         * el objeto.
                         */

                        if (isTouchScrolling) {
                            return;
                        }

                        findObject(this);
                    }
                );

            }
        );


        /* =====================================================
           OBJETOS ENCONTRADOS
        ====================================================== */

        const storageKey =
            "myKitchenFoundObjects";

        let foundObjects = [];


        try {

            foundObjects =
                JSON.parse(
                    localStorage.getItem(storageKey)
                ) || [];

        } catch (error) {

            foundObjects = [];
        }


        function updateScore() {

            scoreElement.textContent =
                foundObjects.length;


            document.querySelectorAll(
                ".hotspot"
            ).forEach(
                function (hotspot) {

                    const objectName =
                        hotspot.dataset.object;

                    if (
                        foundObjects.includes(
                            objectName
                        )
                    ) {

                        hotspot.classList.add(
                            "found"
                        );

                    }

                }
            );

        }


        /* =====================================================
           ENCONTRAR OBJETO
        ====================================================== */

        function findObject(hotspot) {

            const objectName =
                hotspot.dataset.object;

            const word =
                hotspot.dataset.word;

            const sentence =
                hotspot.dataset.sentence;


            if (
                foundObjects.includes(
                    objectName
                )
            ) {

                speak(
                    word
                );

                return;
            }


            foundObjects.push(
                objectName
            );


            localStorage.setItem(
                storageKey,
                JSON.stringify(foundObjects)
            );


            hotspot.classList.add(
                "found"
            );


            updateScore();


            speak(
                sentence
            );


            showFeedback(
                "⭐ " + word + "! ⭐"
            );


            if (
                foundObjects.length >= 10
            ) {

                setTimeout(
                    function () {

                        showFeedback(
                            "🎉 Great job! You found all 10 objects! 🎉"
                        );

                    },
                    1300
                );
            }

        }


        /* =====================================================
           VOZ
        ====================================================== */

        function speak(text) {

            if (
                !("speechSynthesis" in window)
            ) {
                return;
            }


            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            utterance.lang = "en-US";

            utterance.rate = 0.72;

            utterance.pitch = 1.08;


            const voices =
                window.speechSynthesis.getVoices();


            const englishVoice =
                voices.find(
                    function (voice) {

                        return voice.lang &&
                            voice.lang
                                .toLowerCase()
                                .startsWith("en");
                    }
                );


            if (englishVoice) {

                utterance.voice =
                    englishVoice;
            }


            window.speechSynthesis.speak(
                utterance
            );

        }


        /* =====================================================
           FEEDBACK
        ====================================================== */

        let feedbackTimer;


        function showFeedback(message) {

            feedback.textContent =
                message;

            feedback.classList.add(
                "show"
            );


            clearTimeout(
                feedbackTimer
            );


            feedbackTimer =
                setTimeout(
                    function () {

                        feedback.classList.remove(
                            "show"
                        );

                    },
                    1200
                );

        }


        /* =====================================================
           CONTINUAR
        ====================================================== */

        continueButton.addEventListener(
            "click",
            function () {

                window.location.href =
                    "/habitacion/";

            }
        );


        /* =====================================================
           EVITAR ARRASTRAR IMÁGENES
        ====================================================== */

        document.querySelectorAll(
            "img"
        ).forEach(
            function (image) {

                image.addEventListener(
                    "dragstart",
                    function (event) {

                        event.preventDefault();

                    }
                );

            }
        );


        /* =====================================================
           CARGAR PUNTAJE
        ====================================================== */

        updateScore();


        /* =====================================================
           CARGAR VOCES
        ====================================================== */

        if (
            "speechSynthesis" in window
        ) {

            window.speechSynthesis.onvoiceschanged =
                function () {

                    window.speechSynthesis
                        .getVoices();

                };
        }

    </script>

</body>
</html>
