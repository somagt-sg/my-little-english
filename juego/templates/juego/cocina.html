<script>

    /* =====================================================
       ELEMENTOS
    ====================================================== */

    const roomScroll =
        document.getElementById("roomScroll");

    const roomSizer =
        document.getElementById("roomSizer");

    const room =
        document.getElementById("room");

    const character =
        document.getElementById("character");

    const scoreElement =
        document.getElementById("score");

    const feedback =
        document.getElementById("feedback");

    const leftButton =
        document.getElementById("leftButton");

    const rightButton =
        document.getElementById("rightButton");

    const continueButton =
        document.getElementById("continueButton");



    /* =====================================================
       PERSONAJE NIÑO / NIÑA
    ====================================================== */

    const selectedCharacter =
        localStorage.getItem(
            "myLittleEnglishCharacter"
        );


    if (
        selectedCharacter === "girl" ||
        selectedCharacter === "niña" ||
        selectedCharacter === "nina"
    ) {

        character.src =
            "{% static 'juego/images/personaje-niña.png' %}";

        character.classList.add(
            "girl-character"
        );

    } else {

        character.src =
            "{% static 'juego/images/personaje-niño.png' %}";

        character.classList.remove(
            "girl-character"
        );

    }



    /* =====================================================
       ZOOM
    ====================================================== */

    let zoom = 1;

    const MIN_ZOOM = 0.55;

    const MAX_ZOOM = 2.20;


    function updateZoom() {

        room.style.transform =
            "scale(" + zoom + ")";


        roomSizer.style.width =
            (1536 * zoom) + "px";


        roomSizer.style.height =
            (1024 * zoom) + "px";

    }


    updateZoom();



    /* =====================================================
       MOVIMIENTO DEL PERSONAJE
    ====================================================== */

    let characterX = 120;

    const movementSpeed = 7;


    function getCharacterWidth() {

        if (
            character.classList.contains(
                "girl-character"
            )
        ) {

            return 220;

        }

        return 150;

    }



    function moveCharacter(direction) {

        characterX +=
            direction *
            movementSpeed;


        const characterWidth =
            getCharacterWidth();


        const maxX =
            1536 -
            characterWidth -
            20;


        if (characterX < 0) {

            characterX = 0;

        }


        if (characterX > maxX) {

            characterX = maxX;

        }


        character.style.left =
            characterX + "px";


        keepCharacterVisible();

    }



    /* =====================================================
       MANTENER AL PERSONAJE VISIBLE
    ====================================================== */

    function keepCharacterVisible() {

        const characterWidth =
            getCharacterWidth();


        const characterCenter =
            (
                characterX +
                characterWidth / 2
            ) * zoom;


        const viewportWidth =
            roomScroll.clientWidth;


        const currentScroll =
            roomScroll.scrollLeft;


        const leftLimit =
            currentScroll +
            viewportWidth * 0.30;


        const rightLimit =
            currentScroll +
            viewportWidth * 0.70;


        if (
            characterCenter >
            rightLimit
        ) {

            roomScroll.scrollLeft +=
                characterCenter -
                rightLimit;

        }


        if (
            characterCenter <
            leftLimit
        ) {

            roomScroll.scrollLeft -=
                leftLimit -
                characterCenter;

        }

    }



    /* =====================================================
       CAMINAR AUTOMÁTICAMENTE HACIA EL OBJETO
       
       EL PERSONAJE NO APARECE DE GOLPE.

       CAMINA PASO A PASO HASTA QUEDAR
       CERCA DEL OBJETO SELECCIONADO.
    ====================================================== */

    let automaticWalking = false;

    let automaticWalkTimer = null;


    function stopAutomaticWalking() {

        automaticWalking = false;


        if (
            automaticWalkTimer !== null
        ) {

            clearInterval(
                automaticWalkTimer
            );

            automaticWalkTimer = null;

        }

    }



    function walkToObject(hotspot) {

        if (!hotspot) {

            return;

        }


        stopAutomaticWalking();


        /*
         * Posición horizontal del objeto
         * dentro de la cocina.
         */

        const objectLeft =
            hotspot.offsetLeft;


        const objectWidth =
            hotspot.offsetWidth;


        const objectRight =
            objectLeft +
            objectWidth;


        const characterWidth =
            getCharacterWidth();


        /*
         * Distancia que queremos dejar
         * entre el personaje y el objeto.
         */

        const distanceFromObject = 25;


        /*
         * Centro del objeto.
         */

        const objectCenter =
            objectLeft +
            objectWidth / 2;


        /*
         * Centro actual del personaje.
         */

        const characterCenter =
            characterX +
            characterWidth / 2;


        /*
         * Si el personaje está a la izquierda
         * del objeto, se coloca a la izquierda.
         *
         * Si está a la derecha, se coloca
         * a la derecha.
         */

        let targetX;


        if (
            characterCenter <
            objectCenter
        ) {

            targetX =
                objectLeft -
                characterWidth -
                distanceFromObject;

        } else {

            targetX =
                objectRight +
                distanceFromObject;

        }


        /*
         * Si el objeto está muy cerca y el
         * personaje ya está prácticamente allí,
         * no hacemos un recorrido innecesario.
         */

        if (
            Math.abs(
                targetX -
                characterX
            ) < 5
        ) {

            characterX =
                Math.max(
                    0,
                    Math.min(
                        1536 -
                        characterWidth -
                        20,
                        targetX
                    )
                );


            character.style.left =
                characterX + "px";


            keepCharacterVisible();

            return;

        }


        /*
         * Asegurar que el objetivo quede
         * dentro de la cocina.
         */

        targetX =
            Math.max(
                0,
                Math.min(
                    1536 -
                    characterWidth -
                    20,
                    targetX
                )
            );


        automaticWalking = true;


        /*
         * Velocidad de caminata automática.
         *
         * Es independiente de las flechas.
         */

        const automaticSpeed = 5;


        automaticWalkTimer =
            setInterval(
                function() {

                    if (
                        !automaticWalking
                    ) {

                        return;

                    }


                    const difference =
                        targetX -
                        characterX;


                    /*
                     * Ya llegó.
                     */

                    if (
                        Math.abs(
                            difference
                        ) <=
                        automaticSpeed
                    ) {

                        characterX =
                            targetX;


                        character.style.left =
                            characterX + "px";


                        keepCharacterVisible();


                        stopAutomaticWalking();

                        return;

                    }


                    /*
                     * Caminar hacia la izquierda.
                     */

                    if (
                        difference < 0
                    ) {

                        characterX -=
                            automaticSpeed;

                    }


                    /*
                     * Caminar hacia la derecha.
                     */

                    else {

                        characterX +=
                            automaticSpeed;

                    }


                    /*
                     * Límites de la cocina.
                     */

                    if (
                        characterX < 0
                    ) {

                        characterX = 0;

                    }


                    const maxX =
                        1536 -
                        characterWidth -
                        20;


                    if (
                        characterX >
                        maxX
                    ) {

                        characterX =
                            maxX;

                    }


                    character.style.left =
                        characterX + "px";


                    /*
                     * La cámara acompaña al niño
                     * mientras camina.
                     */

                    keepCharacterVisible();

                },
                16
            );

    }



    /* =====================================================
       BOTONES DEL PERSONAJE
    ====================================================== */

    leftButton.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            event.stopPropagation();


            /*
             * Si estaba caminando automáticamente,
             * las flechas toman el control.
             */

            stopAutomaticWalking();


            moveCharacter(-1);

        }
    );


    rightButton.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            event.stopPropagation();


            /*
             * Si estaba caminando automáticamente,
             * las flechas toman el control.
             */

            stopAutomaticWalking();


            moveCharacter(1);

        }
    );



    /* =====================================================
       TECLADO
    ====================================================== */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "ArrowLeft" ||
                event.key.toLowerCase() === "a"
            ) {

                event.preventDefault();


                stopAutomaticWalking();


                moveCharacter(-1);

            }


            if (
                event.key === "ArrowRight" ||
                event.key.toLowerCase() === "d"
            ) {

                event.preventDefault();


                stopAutomaticWalking();


                moveCharacter(1);

            }

        }
    );



    /* =====================================================
       OBJETOS ENCONTRADOS
    ====================================================== */

    const storageKey =
        "myKitchenFoundObjects";


    let foundObjects = [];


    try {

        foundObjects =
            JSON.parse(
                localStorage.getItem(
                    storageKey
                )
            ) || [];

    } catch (error) {

        foundObjects = [];

    }



    /* =====================================================
       ACTUALIZAR PUNTAJE
    ====================================================== */

    function updateScore() {

        scoreElement.textContent =
            foundObjects.length;


        document
            .querySelectorAll(".hotspot")
            .forEach(
                function(hotspot) {

                    const objectName =
                        hotspot.dataset.object;


                    if (
                        foundObjects.includes(
                            objectName
                        )
                    ) {

                        hotspot.classList.add(
                            "found"
                        );

                    }

                }
            );

    }



    /* =====================================================
       ENCONTRAR OBJETO
    ====================================================== */

    function findObject(hotspot) {

        if (!hotspot) {

            return;

        }


        const objectName =
            hotspot.dataset.object;

        const word =
            hotspot.dataset.word;


        /*
         * DETENER CUALQUIER MOVIMIENTO
         * AUTOMÁTICO ANTERIOR.
         */

        stopAutomaticWalking();


        /*
         * HACER QUE EL PERSONAJE CAMINE
         * HACIA EL OBJETO SELECCIONADO.
         *
         * Esto ocurre tanto la primera vez
         * como si se vuelve a tocar el objeto.
         */

        walkToObject(
            hotspot
        );


        /*
         * LA VOZ AHORA PRONUNCIA
         * SOLAMENTE EL NOMBRE.
         */

        if (
            foundObjects.includes(
                objectName
            )
        ) {

            speak(word);

            showFeedback(
                "⭐ " +
                word +
                " ⭐"
            );

            return;

        }


        foundObjects.push(
            objectName
        );


        localStorage.setItem(
            storageKey,
            JSON.stringify(
                foundObjects
            )
        );


        hotspot.classList.add(
            "found"
        );


        updateScore();


        /*
         * SOLO LA PALABRA
         */

        speak(word);


        showFeedback(
            "⭐ " +
            word +
            "! ⭐"
        );


        if (
            foundObjects.length >= 10
        ) {

            setTimeout(
                function() {

                    showFeedback(
                        "🎉 Great job! You found all 10 objects! 🎉"
                    );

                },
                1300
            );

        }

    }



    /* =====================================================
       POINTER EVENTS

       1 DEDO SOBRE OBJETO = SELECCIONAR

       1 DEDO EN ZONA VACÍA = DESPLAZAR

       2 DEDOS = ZOOM

       IMPORTANTE:
       SELECCIONAR UN OBJETO NO DESPLAZA
       LA COCINA CON EL DEDO.
    ====================================================== */

    const activePointers =
        new Map();


    let draggingRoom = false;

    let dragStartX = 0;

    let dragStartY = 0;

    let dragScrollLeft = 0;

    let dragScrollTop = 0;

    let dragMoved = false;

    let activeHotspot = null;


    let pinchStartDistance = 0;

    let pinchStartZoom = 1;



    function distanceBetween(
        point1,
        point2
    ) {

        const dx =
            point2.clientX -
            point1.clientX;

        const dy =
            point2.clientY -
            point1.clientY;


        return Math.sqrt(
            dx * dx +
            dy * dy
        );

    }



    function centerBetween(
        point1,
        point2
    ) {

        return {

            x:
                (
                    point1.clientX +
                    point2.clientX
                ) / 2,

            y:
                (
                    point1.clientY +
                    point2.clientY
                ) / 2

        };

    }



    /* =====================================================
       POINTER DOWN
    ====================================================== */

    roomScroll.addEventListener(
        "pointerdown",
        function(event) {

            if (
                event.pointerType === "mouse" &&
                event.button !== 0
            ) {

                return;

            }


            activePointers.set(
                event.pointerId,
                {
                    clientX:
                        event.clientX,

                    clientY:
                        event.clientY
                }
            );


            const hotspot =
                event.target.closest(
                    ".hotspot"
                );


            /* -------------------------------------
               TOQUE SOBRE OBJETO
            -------------------------------------- */

            if (
                hotspot &&
                activePointers.size === 1
            ) {

                event.preventDefault();

                event.stopPropagation();


                activeHotspot =
                    hotspot;


                draggingRoom =
                    false;


                dragMoved =
                    false;


                dragStartX =
                    event.clientX;


                dragStartY =
                    event.clientY;


                return;

            }


            /* -------------------------------------
               TOQUE EN ZONA VACÍA
            -------------------------------------- */

            if (
                activePointers.size === 1
            ) {

                activeHotspot =
                    null;


                draggingRoom =
                    true;


                dragMoved =
                    false;


                dragStartX =
                    event.clientX;


                dragStartY =
                    event.clientY;


                dragScrollLeft =
                    roomScroll.scrollLeft;


                dragScrollTop =
                    roomScroll.scrollTop;

            }


            /* -------------------------------------
               DOS DEDOS
            -------------------------------------- */

            if (
                activePointers.size === 2
            ) {

                event.preventDefault();


                draggingRoom =
                    false;


                activeHotspot =
                    null;


                dragMoved =
                    true;


                const points =
                    Array.from(
                        activePointers.values()
                    );


                pinchStartDistance =
                    distanceBetween(
                        points[0],
                        points[1]
                    );


                pinchStartZoom =
                    zoom;

            }

        },
        {
            passive: false
        }
    );



    /* =====================================================
       POINTER MOVE
    ====================================================== */

    roomScroll.addEventListener(
        "pointermove",
        function(event) {

            if (
                !activePointers.has(
                    event.pointerId
                )
            ) {

                return;

            }


            activePointers.set(
                event.pointerId,
                {
                    clientX:
                        event.clientX,

                    clientY:
                        event.clientY
                }
            );


            /* -------------------------------------
               DOS DEDOS = ZOOM
            -------------------------------------- */

            if (
                activePointers.size >= 2
            ) {

                event.preventDefault();


                const points =
                    Array.from(
                        activePointers.values()
                    );


                const currentDistance =
                    distanceBetween(
                        points[0],
                        points[1]
                    );


                if (
                    pinchStartDistance <= 0
                ) {

                    return;

                }


                let newZoom =
                    pinchStartZoom *
                    (
                        currentDistance /
                        pinchStartDistance
                    );


                newZoom =
                    Math.max(
                        MIN_ZOOM,
                        Math.min(
                            MAX_ZOOM,
                            newZoom
                        )
                    );


                const oldZoom =
                    zoom;


                const center =
                    centerBetween(
                        points[0],
                        points[1]
                    );


                const contentX =
                    (
                        roomScroll.scrollLeft +
                        center.x
                    ) / oldZoom;


                const contentY =
                    (
                        roomScroll.scrollTop +
                        center.y
                    ) / oldZoom;


                zoom =
                    newZoom;


                updateZoom();


                roomScroll.scrollLeft =
                    (
                        contentX *
                        zoom
                    ) -
                    center.x;


                roomScroll.scrollTop =
                    (
                        contentY *
                        zoom
                    ) -
                    center.y;


                return;

            }



            /* -------------------------------------
               UN DEDO = DESPLAZAMIENTO
               
               SOLO SI NO HAY HOTSPOT ACTIVO.
            -------------------------------------- */

            if (
                activePointers.size === 1 &&
                draggingRoom &&
                !activeHotspot
            ) {

                event.preventDefault();


                const deltaX =
                    event.clientX -
                    dragStartX;


                const deltaY =
                    event.clientY -
                    dragStartY;


                if (
                    Math.abs(deltaX) > 8 ||
                    Math.abs(deltaY) > 8
                ) {

                    dragMoved =
                        true;

                }


                roomScroll.scrollLeft =
                    dragScrollLeft -
                    deltaX;


                roomScroll.scrollTop =
                    dragScrollTop -
                    deltaY;

            }



            /* -------------------------------------
               DEDO SOBRE OBJETO

               NO MUEVE LA COCINA.
            -------------------------------------- */

            if (
                activeHotspot &&
                activePointers.size === 1
            ) {

                const deltaX =
                    event.clientX -
                    dragStartX;


                const deltaY =
                    event.clientY -
                    dragStartY;


                if (
                    Math.abs(deltaX) > 10 ||
                    Math.abs(deltaY) > 10
                ) {

                    dragMoved =
                        true;

                }

            }

        },
        {
            passive: false
        }
    );



    /* =====================================================
       POINTER UP
    ====================================================== */

    roomScroll.addEventListener(
        "pointerup",
        function(event) {

            const selectedHotspot =
                activeHotspot;


            const moved =
                dragMoved;


            activePointers.delete(
                event.pointerId
            );


            /*
             * TOQUE CORTO:
             * SELECCIONAR OBJETO
             */

            if (
                selectedHotspot &&
                !moved &&
                activePointers.size === 0
            ) {

                event.preventDefault();

                event.stopPropagation();


                findObject(
                    selectedHotspot
                );

            }


            if (
                activePointers.size === 0
            ) {

                draggingRoom =
                    false;


                activeHotspot =
                    null;


                dragMoved =
                    false;


                pinchStartDistance =
                    0;

            }


            /*
             * SI QUEDA UN DEDO
             * DESPUÉS DEL ZOOM
             */

            if (
                activePointers.size === 1
            ) {

                const remaining =
                    Array.from(
                        activePointers.values()
                    )[0];


                draggingRoom =
                    true;


                activeHotspot =
                    null;


                dragMoved =
                    false;


                dragStartX =
                    remaining.clientX;


                dragStartY =
                    remaining.clientY;


                dragScrollLeft =
                    roomScroll.scrollLeft;


                dragScrollTop =
                    roomScroll.scrollTop;

            }

        },
        {
            passive: false
        }
    );



    /* =====================================================
       POINTER CANCEL
    ====================================================== */

    roomScroll.addEventListener(
        "pointercancel",
        function(event) {

            activePointers.delete(
                event.pointerId
            );


            if (
                activePointers.size === 0
            ) {

                draggingRoom =
                    false;


                activeHotspot =
                    null;


                dragMoved =
                    false;


                pinchStartDistance =
                    0;

            }

        }
    );



    /* =====================================================
       EVITAR ARRASTRE DE IMÁGENES
    ====================================================== */

    document
        .querySelectorAll("img")
        .forEach(
            function(image) {

                image.addEventListener(
                    "dragstart",
                    function(event) {

                        event.preventDefault();

                    }
                );

            }
        );



    /* =====================================================
       VOZ
    ====================================================== */

    function speak(text) {

        if (
            !(
                "speechSynthesis"
                in window
            )
        ) {

            return;

        }


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                text
            );


        utterance.lang =
            "en-US";


        utterance.rate =
            0.72;


        utterance.pitch =
            1.08;


        const voices =
            window.speechSynthesis
                .getVoices();


        const englishVoice =
            voices.find(
                function(voice) {

                    return (
                        voice.lang &&
                        voice.lang
                            .toLowerCase()
                            .startsWith("en")
                    );

                }
            );


        if (
            englishVoice
        ) {

            utterance.voice =
                englishVoice;

        }


        window.speechSynthesis.speak(
            utterance
        );

    }



    /* =====================================================
       FEEDBACK
    ====================================================== */

    let feedbackTimer;


    function showFeedback(
        message
    ) {

        feedback.textContent =
            message;


        feedback.classList.add(
            "show"
        );


        clearTimeout(
            feedbackTimer
        );


        feedbackTimer =
            setTimeout(
                function() {

                    feedback.classList.remove(
                        "show"
                    );

                },
                1300
            );

    }



    /* =====================================================
       CONTINUAR
    ====================================================== */

    continueButton.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            event.stopPropagation();

        }
    );


    continueButton.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            event.stopPropagation();


            window.location.href =
                "/habitacion/";

        }
    );



    /* =====================================================
       CARGAR PUNTAJE
    ====================================================== */

    updateScore();

</script>
