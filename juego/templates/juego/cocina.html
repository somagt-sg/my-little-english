{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Little English - My Kitchen</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #222;
        }

        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: rgba(255, 255, 255, 0.96);
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            box-shadow: 0 3px 10px rgba(0,0,0,.25);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #14532d;
        }

        .mission {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .stars {
            font-size: 20px;
            font-weight: bold;
            color: #f59e0b;
            white-space: nowrap;
        }

        /* =========================
           GAME AREA
        ========================= */

        .game-container {
            position: absolute;

            top: 72px;
            left: 0;
            right: 0;
            bottom: 0;

            overflow: hidden;

            background: #ddd;
        }

        .room-scroll {
            width: 100%;
            height: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            -webkit-overflow-scrolling: touch;
        }

        .room {
            position: relative;

            width: 1536px;
            min-width: 1536px;
            height: 1024px;

            background: #eee;
        }

        .room-background {
            position: absolute;

            left: 0;
            top: 0;

            width: 1536px;
            height: 1024px;

            object-fit: fill;

            user-select: none;
            pointer-events: none;
        }

        /* =========================
           CHARACTER
        ========================= */

        #character {
            position: absolute;

            left: 120px;
            bottom: 45px;

            width: 150px;
            height: 205px;

            z-index: 100;

            object-fit: contain;

            user-select: none;
            pointer-events: none;

            transition: left .08s linear;
        }

        /* =========================
           NIÑA MÁS GRANDE
        ========================= */

        #character.girl-character {
            width: 220px;
            height: 300px;
            bottom: 15px;
        }

        /* =========================
           HOTSPOTS
        ========================= */

        .hotspot {
            position: absolute;

            border: 3px dashed rgba(255,255,255,0);
            border-radius: 20px;

            cursor: pointer;

            z-index: 50;

            transition: all .2s ease;
        }

        .hotspot:hover {
            border-color: rgba(255,255,255,.75);
            background: rgba(255,255,255,.12);
        }

        .hotspot.found {
            border: 4px solid #22c55e;
            background: rgba(34,197,94,.28);

            cursor: default;
        }

        /* =========================
           OBJECT LABEL
        ========================= */

        .object-label {
            position: absolute;

            left: 50%;
            top: -42px;

            transform: translateX(-50%);

            background: #14532d;
            color: white;

            padding: 7px 14px;

            border-radius: 15px;

            font-size: 18px;
            font-weight: bold;

            white-space: nowrap;

            opacity: 0;
            pointer-events: none;

            transition: opacity .2s ease;

            box-shadow: 0 3px 8px rgba(0,0,0,.3);
        }

        .hotspot.found .object-label {
            opacity: 1;
        }

        /* =========================
           FEEDBACK
        ========================= */

        #feedback {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%) scale(.8);

            background: white;

            padding: 25px 35px;

            border-radius: 25px;

            box-shadow: 0 10px 40px rgba(0,0,0,.35);

            font-size: 30px;
            font-weight: bold;

            color: #14532d;

            z-index: 2000;

            opacity: 0;
            pointer-events: none;

            transition: all .25s ease;

            text-align: center;
        }

        #feedback.show {
            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            position: fixed;

            bottom: 18px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 1200;

            display: flex;
            gap: 15px;

            align-items: center;
        }

        .control-button {
            width: 65px;
            height: 65px;

            border: none;
            border-radius: 50%;

            background: white;

            font-size: 30px;

            box-shadow:
                0 4px 12px rgba(0,0,0,.3);

            cursor: pointer;

            user-select: none;
        }

        .control-button:active {
            transform: scale(.9);
        }

        .continue-button {
            display: none;

            padding: 14px 25px;

            border: none;
            border-radius: 25px;

            background: #14532d;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 12px rgba(0,0,0,.3);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .top-bar {
                height: 62px;
                padding: 0 10px;
            }

            .title {
                font-size: 17px;
            }

            .mission {
                font-size: 14px;
            }

            .stars {
                font-size: 15px;
            }

            .game-container {
                top: 62px;
            }

            .room-scroll {
                overflow-x: auto;
                overflow-y: hidden;
            }

            .room {
                width: 1536px;
                min-width: 1536px;
                height: 1024px;
            }

            .room-background {
                width: 1536px;
                height: 1024px;
            }

            #character {
                width: 150px;
                height: 205px;
                bottom: 45px;
            }

            #character.girl-character {
                width: 220px;
                height: 300px;
                bottom: 15px;
            }

            .controls {
                bottom: 10px;
            }

            .control-button {
                width: 58px;
                height: 58px;
            }

            .object-label {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================= -->

    <div class="top-bar">

        <div class="title">
            🍳 My Kitchen
        </div>

        <div class="mission">
            Find the objects!
        </div>

        <div class="stars">
            ⭐ <span id="starCount">0</span>/10
        </div>

    </div>


    <!-- =========================
         GAME
    ========================= -->

    <div class="game-container">

        <div class="room-scroll" id="roomScroll">

            <div class="room" id="room">

                <!-- =========================
                     BACKGROUND
                ========================= -->

                <img
                    src="{% static 'juego/images/my-kitchen.jpeg' %}"
                    class="room-background"
                    alt="My Kitchen"
                >


                <!-- =========================
                     1. APPLE
                ========================= -->

                <div
                    class="hotspot"
                    id="apple"
                    data-word="Apple"
                    style="
                        left: 815px;
                        top: 570px;
                        width: 115px;
                        height: 105px;
                    "
                >
                    <div class="object-label">
                        🍎 Apple
                    </div>
                </div>


                <!-- =========================
                     2. BREAD
                ========================= -->

                <div
                    class="hotspot"
                    id="bread"
                    data-word="Bread"
                    style="
                        left: 900px;
                        top: 535px;
                        width: 180px;
                        height: 120px;
                    "
                >
                    <div class="object-label">
                        🍞 Bread
                    </div>
                </div>


                <!-- =========================
                     3. EGGS
                ========================= -->

                <div
                    class="hotspot"
                    id="eggs"
                    data-word="Eggs"
                    style="
                        left: 1080px;
                        top: 565px;
                        width: 135px;
                        height: 105px;
                    "
                >
                    <div class="object-label">
                        🥚 Eggs
                    </div>
                </div>


                <!-- =========================
                     4. CUP
                ========================= -->

                <div
                    class="hotspot"
                    id="cup"
                    data-word="Cup"
                    style="
                        left: 1060px;
                        top: 650px;
                        width: 105px;
                        height: 105px;
                    "
                >
                    <div class="object-label">
                        ☕ Cup
                    </div>
                </div>


                <!-- =========================
                     5. BOWL
                ========================= -->

                <div
                    class="hotspot"
                    id="bowl"
                    data-word="Bowl"
                    style="
                        left: 1190px;
                        top: 660px;
                        width: 150px;
                        height: 115px;
                    "
                >
                    <div class="object-label">
                        🥣 Bowl
                    </div>
                </div>


                <!-- =========================
                     6. GLASS
                ========================= -->

                <div
                    class="hotspot"
                    id="glass"
                    data-word="Glass"
                    style="
                        left: 1310px;
                        top: 660px;
                        width: 100px;
                        height: 145px;
                    "
                >
                    <div class="object-label">
                        🥛 Glass
                    </div>
                </div>


                <!-- =========================
                     7. SPOON
                ========================= -->

                <div
                    class="hotspot"
                    id="spoon"
                    data-word="Spoon"
                    style="
                        left: 930px;
                        top: 675px;
                        width: 85px;
                        height: 155px;
                        transform: rotate(-25deg);
                    "
                >
                    <div class="object-label">
                        🥄 Spoon
                    </div>
                </div>


                <!-- =========================
                     8. FORK
                ========================= -->

                <div
                    class="hotspot"
                    id="fork"
                    data-word="Fork"
                    style="
                        left: 1000px;
                        top: 675px;
                        width: 85px;
                        height: 155px;
                        transform: rotate(-25deg);
                    "
                >
                    <div class="object-label">
                        🍴 Fork
                    </div>
                </div>


                <!-- =========================
                     9. KNIFE
                ========================= -->

                <div
                    class="hotspot"
                    id="knife"
                    data-word="Knife"
                    style="
                        left: 1070px;
                        top: 670px;
                        width: 85px;
                        height: 160px;
                        transform: rotate(-25deg);
                    "
                >
                    <div class="object-label">
                        🔪 Knife
                    </div>
                </div>


                <!-- =========================
                     10. REFRIGERATOR
                ========================= -->

                <div
                    class="hotspot"
                    id="refrigerator"
                    data-word="Refrigerator"
                    style="
                        left: 90px;
                        top: 25px;
                        width: 225px;
                        height: 825px;
                    "
                >
                    <div class="object-label">
                        🧊 Refrigerator
                    </div>
                </div>


                <!-- =========================
                     CHARACTER
                ========================= -->

                <img
                    id="character"
                    src="{% static 'juego/images/personaje-niño.png' %}"
                    alt="Character"
                >

            </div>

        </div>

    </div>


    <!-- =========================
         FEEDBACK
    ========================= -->

    <div id="feedback">
        ⭐ Great job! ⭐
    </div>


    <!-- =========================
         CONTROLS
    ========================= -->

    <div class="controls">

        <button
            class="control-button"
            id="leftButton"
            type="button"
        >
            ◀
        </button>

        <button
            class="continue-button"
            id="continueButton"
            type="button"
        >
            🚀 Continue
        </button>

        <button
            class="control-button"
            id="rightButton"
            type="button"
        >
            ▶
        </button>

    </div>


    <script>

        /* ========================================
           PERSONAJE SELECCIONADO
        ======================================== */

        const character =
            document.getElementById("character");

        const selectedCharacter =
            localStorage.getItem(
                "myLittleEnglishCharacter"
            );


        /*
           NIÑA
        */

        if (
            selectedCharacter === "girl" ||
            selectedCharacter === "niña" ||
            selectedCharacter === "nina"
        ) {

            character.src =
                "{% static 'juego/images/personaje-niña.png' %}";

            character.classList.add(
                "girl-character"
            );

        }

        /*
           NIÑO
        */

        else {

            character.src =
                "{% static 'juego/images/personaje-niño.png' %}";

            character.classList.remove(
                "girl-character"
            );
        }


        /* ========================================
           VARIABLES
        ======================================== */

        let characterX = 120;

        let movingLeft = false;
        let movingRight = false;

        const movementSpeed = 7;

        const room =
            document.getElementById("room");

        const roomScroll =
            document.getElementById("roomScroll");


        /* ========================================
           OBJETOS
        ======================================== */

        const hotspots =
            document.querySelectorAll(".hotspot");

        const starCount =
            document.getElementById("starCount");

        const feedback =
            document.getElementById("feedback");

        const continueButton =
            document.getElementById(
                "continueButton"
            );


        /* ========================================
           OBJETOS ENCONTRADOS
        ======================================== */

        const storageKey =
            "myKitchenFoundObjects";

        let foundObjects =
            JSON.parse(
                localStorage.getItem(
                    storageKey
                ) || "[]"
            );


        /* ========================================
           RESTAURAR OBJETOS
        ======================================== */

        hotspots.forEach(
            hotspot => {

                if (
                    foundObjects.includes(
                        hotspot.id
                    )
                ) {

                    hotspot.classList.add(
                        "found"
                    );

                }

            }
        );


        starCount.textContent =
            foundObjects.length;


        /* ========================================
           VOZ
        ======================================== */

        function speakWord(word) {

            if (
                !("speechSynthesis" in window)
            ) {
                return;
            }

            window.speechSynthesis.cancel();

            const utterance =
                new SpeechSynthesisUtterance(
                    word
                );

            utterance.lang = "en-US";
            utterance.rate = 0.72;
            utterance.pitch = 1.08;

            const voices =
                window.speechSynthesis
                    .getVoices();

            const englishVoice =
                voices.find(
                    voice =>
                        voice.lang &&
                        voice.lang
                            .toLowerCase()
                            .startsWith("en")
                );

            if (englishVoice) {

                utterance.voice =
                    englishVoice;

            }

            window.speechSynthesis.speak(
                utterance
            );
        }


        /* ========================================
           FEEDBACK
        ======================================== */

        function showFeedback(word) {

            feedback.textContent =
                "⭐ Great job! " +
                word +
                "! ⭐";

            feedback.classList.add(
                "show"
            );

            setTimeout(
                () => {

                    feedback.classList.remove(
                        "show"
                    );

                },
                1200
            );
        }


        /* ========================================
           CLICK EN OBJETOS
        ======================================== */

        hotspots.forEach(
            hotspot => {

                hotspot.addEventListener(
                    "click",
                    () => {

                        if (
                            hotspot.classList
                                .contains("found")
                        ) {
                            return;
                        }

                        const word =
                            hotspot.dataset.word;

                        hotspot.classList.add(
                            "found"
                        );

                        foundObjects.push(
                            hotspot.id
                        );

                        localStorage.setItem(
                            storageKey,
                            JSON.stringify(
                                foundObjects
                            )
                        );

                        starCount.textContent =
                            foundObjects.length;

                        speakWord(word);

                        showFeedback(word);


                        /* =========================
                           COMPLETADO
                        ========================= */

                        if (
                            foundObjects.length === 10
                        ) {

                            setTimeout(
                                () => {

                                    continueButton
                                        .style
                                        .display =
                                        "block";

                                },
                                1300
                            );
                        }

                    }
                );

            }
        );


        /* ========================================
           MOVIMIENTO
        ======================================== */

        function moveCharacter() {

            const characterWidth =
                character.classList.contains(
                    "girl-character"
                )
                    ? 220
                    : 150;


            if (movingLeft) {

                characterX -=
                    movementSpeed;
            }


            if (movingRight) {

                characterX +=
                    movementSpeed;
            }


            const maxX =
                room.offsetWidth -
                characterWidth -
                20;


            if (characterX < 20) {

                characterX = 20;
            }


            if (characterX > maxX) {

                characterX = maxX;
            }


            character.style.left =
                characterX + "px";


            /* =========================
               AUTO SCROLL
            ========================= */

            const visibleWidth =
                roomScroll.clientWidth;

            const scrollLeft =
                roomScroll.scrollLeft;

            const characterRight =
                characterX +
                characterWidth;

            const margin = 150;


            if (
                characterRight >
                scrollLeft +
                visibleWidth -
                margin
            ) {

                roomScroll.scrollLeft =
                    Math.min(
                        characterRight -
                            visibleWidth +
                            margin,

                        room.offsetWidth -
                            visibleWidth
                    );
            }


            if (
                characterX <
                scrollLeft + margin
            ) {

                roomScroll.scrollLeft =
                    Math.max(
                        characterX -
                            margin,

                        0
                    );
            }


            requestAnimationFrame(
                moveCharacter
            );
        }


        moveCharacter();


        /* ========================================
           TECLADO
        ======================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    movingLeft = true;
                }


                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    movingRight = true;
                }

            }
        );


        document.addEventListener(
            "keyup",
            event => {

                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    movingLeft = false;
                }


                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    movingRight = false;
                }

            }
        );


        /* ========================================
           BOTÓN IZQUIERDO
        ======================================== */

        const leftButton =
            document.getElementById(
                "leftButton"
            );


        leftButton.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                movingLeft = true;
            }
        );


        leftButton.addEventListener(
            "pointerup",
            () => {

                movingLeft = false;
            }
        );


        leftButton.addEventListener(
            "pointerleave",
            () => {

                movingLeft = false;
            }
        );


        leftButton.addEventListener(
            "pointercancel",
            () => {

                movingLeft = false;
            }
        );


        /* ========================================
           BOTÓN DERECHO
        ======================================== */

        const rightButton =
            document.getElementById(
                "rightButton"
            );


        rightButton.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                movingRight = true;
            }
        );


        rightButton.addEventListener(
            "pointerup",
            () => {

                movingRight = false;
            }
        );


        rightButton.addEventListener(
            "pointerleave",
            () => {

                movingRight = false;
            }
        );


        rightButton.addEventListener(
            "pointercancel",
            () => {

                movingRight = false;
            }
        );


        /* ========================================
           TOUCH / SWIPE
        ======================================== */

        let touchStartX = null;


        roomScroll.addEventListener(
            "touchstart",
            event => {

                if (
                    event.touches.length !== 1
                ) {
                    return;
                }

                touchStartX =
                    event.touches[0].clientX;

            },
            {
                passive: true
            }
        );


        roomScroll.addEventListener(
            "touchmove",
            event => {

                if (
                    touchStartX === null ||
                    event.touches.length !== 1
                ) {
                    return;
                }

                const currentX =
                    event.touches[0].clientX;

                const difference =
                    touchStartX -
                    currentX;

                roomScroll.scrollLeft +=
                    difference;

                touchStartX =
                    currentX;

            },
            {
                passive: true
            }
        );


        roomScroll.addEventListener(
            "touchend",
            () => {

                touchStartX = null;

            },
            {
                passive: true
            }
        );


        /* ========================================
           CONTINUAR
           SIN NAMESPACE juego
        ======================================== */

        continueButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    "/habitacion/";
            }
        );


        /* ========================================
           CARGA DE VOCES
        ======================================== */

        if (
            "speechSynthesis" in window
        ) {

            window.speechSynthesis
                .onvoiceschanged =
                () => {

                    window.speechSynthesis
                        .getVoices();
                };
        }

    </script>

</body>
</html>
