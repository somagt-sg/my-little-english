<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Little English</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Trebuchet MS", Arial, sans-serif;
            background:
                linear-gradient(
                    180deg,
                    #8ed8ff 0%,
                    #bcecff 48%,
                    #ffe6a8 48%,
                    #ffd27d 100%
                );
            overflow-x: hidden;
        }

        /* =========================
           FONDO
        ========================= */

        .sky {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 999px;
            opacity: 0.85;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud.one {
            width: 150px;
            height: 45px;
            top: 80px;
            left: 8%;
        }

        .cloud.one::before {
            width: 65px;
            height: 65px;
            left: 25px;
            top: -30px;
        }

        .cloud.one::after {
            width: 80px;
            height: 80px;
            right: 20px;
            top: -40px;
        }

        .cloud.two {
            width: 130px;
            height: 40px;
            top: 150px;
            right: 10%;
        }

        .cloud.two::before {
            width: 55px;
            height: 55px;
            left: 20px;
            top: -25px;
        }

        .cloud.two::after {
            width: 70px;
            height: 70px;
            right: 15px;
            top: -35px;
        }

        .sun {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #ffd84d;
            top: 45px;
            right: 8%;
            box-shadow: 0 0 35px rgba(255, 216, 77, 0.7);
        }

        /* =========================
           CONTENEDOR PRINCIPAL
        ========================= */

        .game {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 18px;
        }

        .card {
            width: min(560px, 100%);
            background: rgba(255, 255, 255, 0.96);
            border-radius: 32px;
            padding: 35px 30px 30px;
            text-align: center;
            box-shadow:
                0 20px 45px rgba(61, 91, 110, 0.22);
        }

        /* =========================
           TITULO
        ========================= */

        .logo {
            font-size: clamp(34px, 8vw, 55px);
            font-weight: 900;
            color: #155e75;
            letter-spacing: 1px;
            text-shadow: 3px 4px 0 #b9f0ff;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 20px;
            color: #52717b;
            font-weight: 700;
        }

        .stars {
            margin: 18px 0 25px;
            font-size: 27px;
            letter-spacing: 8px;
        }

        /* =========================
           PERSONAJES
        ========================= */

        .question {
            font-size: 26px;
            color: #243b53;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .characters {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .character {
            width: 180px;
            min-height: 190px;
            border: 4px solid transparent;
            border-radius: 25px;
            background: #f8fbff;
            cursor: pointer;
            padding: 15px;
            transition: 0.2s ease;
        }

        .character:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
        }

        .character.selected {
            border-color: #ffb703;
            background: #fff8dc;
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 12px 25px rgba(255, 183, 3, 0.25);
        }

        .avatar {
            width: 105px;
            height: 105px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            background: #e0f7ff;
        }

        .character-name {
            margin-top: 10px;
            font-size: 22px;
            font-weight: 900;
            color: #243b53;
        }

        /* =========================
           NOMBRE
        ========================= */

        .name-section {
            margin-top: 5px;
        }

        .name-section label {
            display: block;
            font-size: 23px;
            font-weight: 900;
            color: #243b53;
            margin-bottom: 12px;
        }

        .name-input {
            width: 100%;
            height: 58px;
            border: 3px solid #b8dbe8;
            border-radius: 18px;
            padding: 0 18px;
            font-size: 22px;
            text-align: center;
            font-family: inherit;
            outline: none;
            color: #243b53;
            background: #f9fdff;
        }

        .name-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        /* =========================
           BOTON PLAY
        ========================= */

        .play-button {
            width: 100%;
            margin-top: 25px;
            height: 64px;
            border: none;
            border-radius: 20px;
            background: #22c55e;
            color: white;
            font-family: inherit;
            font-size: 28px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 7px 0 #159447;
            transition: 0.15s ease;
        }

        .play-button:hover {
            background: #2dd469;
        }

        .play-button:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #159447;
        }

        /* =========================
           MENSAJE
        ========================= */

        .message {
            min-height: 25px;
            margin-top: 15px;
            color: #dc2626;
            font-weight: 800;
            font-size: 16px;
        }

        /* =========================
           PANTALLA BIENVENIDA
        ========================= */

        .welcome {
            display: none;
        }

        .welcome.active {
            display: block;
            animation: appear 0.5s ease;
        }

        .welcome-avatar {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            border-radius: 50%;
            background: #e0f7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 105px;
        }

        .welcome h2 {
            font-size: 35px;
            color: #155e75;
            margin-bottom: 12px;
        }

        .welcome p {
            font-size: 21px;
            line-height: 1.5;
            color: #526b76;
            font-weight: 700;
        }

        .continue-button {
            margin-top: 25px;
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 18px;
            background: #f59e0b;
            color: white;
            font-family: inherit;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 #c77700;
        }

        .continue-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #c77700;
        }

        /* =========================
           ANIMACION
        ========================= */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 500px) {

            .card {
                padding: 28px 18px 22px;
                border-radius: 25px;
            }

            .characters {
                gap: 12px;
            }

            .character {
                width: 145px;
                min-height: 170px;
            }

            .avatar {
                width: 90px;
                height: 90px;
                font-size: 60px;
            }

            .character-name {
                font-size: 19px;
            }

            .question {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         FONDO
    ========================== -->

    <div class="sky">
        <div class="sun"></div>
        <div class="cloud one"></div>
        <div class="cloud two"></div>
    </div>


    <!-- =========================
         JUEGO
    ========================== -->

    <main class="game">

        <section class="card">

            <!-- PANTALLA DE CREACION -->

            <div id="setupScreen">

                <div class="logo">
                    MY LITTLE ENGLISH
                </div>

                <div class="subtitle">
                    🌴 My English Adventure 🌴
                </div>

                <div class="stars">
                    ⭐ ⭐ ⭐
                </div>


                <div class="question">
                    Who are you?
                </div>


                <div class="characters">

                    <!-- NIÑA -->

                    <button
                        type="button"
                        class="character"
                        id="girlButton"
                        onclick="selectCharacter('girl')"
                    >

                        <div class="avatar">
                            👧
                        </div>

                        <div class="character-name">
                            GIRL
                        </div>

                    </button>


                    <!-- NIÑO -->

                    <button
                        type="button"
                        class="character"
                        id="boyButton"
                        onclick="selectCharacter('boy')"
                    >

                        <div class="avatar">
                            👦
                        </div>

                        <div class="character-name">
                            BOY
                        </div>

                    </button>

                </div>


                <!-- NOMBRE -->

                <div class="name-section">

                    <label for="playerName">
                        What's your name?
                    </label>

                    <input
                        type="text"
                        id="playerName"
                        class="name-input"
                        maxlength="20"
                        placeholder="Type your name..."
                        autocomplete="off"
                    >

                </div>


                <button
                    type="button"
                    class="play-button"
                    onclick="startGame()"
                >
                    ▶ PLAY
                </button>


                <div
                    id="message"
                    class="message"
                ></div>

            </div>


            <!-- =========================
                 BIENVENIDA
            ========================== -->

            <div
                id="welcomeScreen"
                class="welcome"
            >

                <div class="logo">
                    MY LITTLE ENGLISH
                </div>

                <div
                    id="welcomeAvatar"
                    class="welcome-avatar"
                >
                    👧
                </div>

                <h2 id="welcomeTitle">
                    Hi!
                </h2>

                <p>
                    Welcome to your
                    <br>
                    <strong>English Adventure!</strong> 🌴
                </p>

                <p style="margin-top: 10px;">
                    Let's learn English
                    <br>
                    and have fun! ⭐
                </p>

                <button
                    type="button"
                    class="continue-button"
                    onclick="continueGame()"
                >
                    LET'S GO! 🚀
                </button>

            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        let selectedCharacter = null;


        // ==========================================
        // ELEGIR PERSONAJE
        // ==========================================

        function selectCharacter(character) {

            selectedCharacter = character;

            const girlButton = document.getElementById("girlButton");
            const boyButton = document.getElementById("boyButton");

            girlButton.classList.remove("selected");
            boyButton.classList.remove("selected");

            if (character === "girl") {
                girlButton.classList.add("selected");
            }

            if (character === "boy") {
                boyButton.classList.add("selected");
            }

            document.getElementById("message").textContent = "";
        }


        // ==========================================
        // COMENZAR JUEGO
        // ==========================================

        function startGame() {

            const nameInput = document.getElementById("playerName");

            const name = nameInput.value.trim();

            const message = document.getElementById("message");


            // Comprobar personaje

            if (!selectedCharacter) {

                message.textContent =
                    "Choose GIRL or BOY first! 😊";

                return;
            }


            // Comprobar nombre

            if (!name) {

                message.textContent =
                    "Tell me your name! 😊";

                nameInput.focus();

                return;
            }


            // Guardar datos del jugador

            localStorage.setItem(
                "myLittleEnglishName",
                name
            );

            localStorage.setItem(
                "myLittleEnglishCharacter",
                selectedCharacter
            );


            // Cambiar pantalla

            const setupScreen =
                document.getElementById("setupScreen");

            const welcomeScreen =
                document.getElementById("welcomeScreen");

            const welcomeAvatar =
                document.getElementById("welcomeAvatar");

            const welcomeTitle =
                document.getElementById("welcomeTitle");


            if (selectedCharacter === "girl") {

                welcomeAvatar.textContent = "👧";

            } else {

                welcomeAvatar.textContent = "👦";

            }


            welcomeTitle.textContent =
                "Hi, " + name + "! 👋";


            setupScreen.style.display = "none";

            welcomeScreen.classList.add("active");

        }


        // ==========================================
        // CONTINUAR
        // ==========================================

        function continueGame() {

            window.location.href = "/habitacion/";

        }


        // ==========================================
        // ENTER PARA JUGAR
        // ==========================================

        document
            .getElementById("playerName")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    startGame();

                }

            });

    </script>

</body>
</html>
